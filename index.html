<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Busca peliculas - IA Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #05080a; --surface: #0f1520; --border: rgba(255,255,255,0.1); 
            --text: #f0f4ff; --accent: #4f8ef7; --neon-green: #2ecc71;
            --search-green: #142514;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); overflow-x: hidden; }
        
        header { 
            position: sticky; top: 0; background: rgba(5,8,10,0.95); 
            backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); 
            padding: 15px; z-index: 100;
        }

        .header-content {
            max-width: 1300px; margin: 0 auto;
            display: flex; flex-direction: column; gap: 15px;
        }

        .top-row { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-family: 'Bebas Neue', sans-serif; font-size: 1.8rem; letter-spacing: 2px; cursor: pointer; text-transform: uppercase; }
        .logo span { color: var(--neon-green); }

        .search-container { 
            display: flex; align-items: center; gap: 10px; width: 100%;
        }
        .search-label { 
            font-family: 'Bebas Neue', sans-serif; font-size: 1.2rem; 
            letter-spacing: 1px; color: var(--text); white-space: nowrap;
        }
        .search-wrap { flex: 1; position: relative; }
        input#search-input { 
            width: 100%; padding: 12px 15px; border-radius: 10px; 
            border: 2px solid var(--neon-green); background: var(--search-green); 
            color: white; outline: none; font-size: 1rem;
        }

        .container { max-width: 1300px; margin: 10px auto; padding: 0 15px; }
        .section-title { 
            font-family: 'Bebas Neue', sans-serif; font-size: 1.5rem; 
            letter-spacing: 1.5px; margin: 25px 0 15px; display: flex; 
            align-items: center; gap: 10px; 
        }
        .section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); 
            gap: 15px; margin-bottom: 40px; 
        }

        .item-card { background: var(--surface); border-radius: 12px; overflow: hidden; border: 1px solid var(--border); display: flex; flex-direction: column; }
        .poster { width: 100%; aspect-ratio: 2/3; object-fit: cover; background: #1a1a1a; }
        .item-info { padding: 12px; flex-grow: 1; display: flex; flex-direction: column; }
        .item-title { font-size: 0.9rem; font-weight: bold; margin-bottom: 4px; line-height: 1.2; }
        .item-date { font-size: 0.75rem; color: var(--accent); margin-bottom: 8px; }
        
        .provider-row { display: flex; gap: 6px; margin-top: auto; flex-wrap: wrap; }
        .mini-logo { height: 28px; width: 55px; border-radius: 4px; object-fit: contain; background: white; padding: 3px; border: 1px solid #ddd; }

        @media (max-width: 480px) {
            .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .search-label { font-size: 1rem; }
            .logo { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

<header>
    <div class="header-content">
        <div class="top-row">
            <div class="logo" onclick="location.reload()">Busca<span> peliculas</span></div>
            <div style="font-size: 0.8rem; color: var(--accent); cursor: pointer;" onclick="location.reload()">🏠 Inicio</div>
        </div>
        
        <div class="search-container">
            <label class="search-label" for="search-input">Título:</label>
            <div class="search-wrap">
                <input type="text" id="search-input" placeholder="Ej: Once Nueva..." onkeyup="handleSearch(event)">
            </div>
        </div>
    </div>
</header>

<main class="container" id="main-container">
    <p style="text-align:center; padding:40px; color:var(--accent); font-size: 0.9rem;">
        Escribí el nombre de una película o serie para ver dónde está disponible.
    </p>
</main>

<script>
    const TMDB_KEY = '5fe1eec4e7d975c66b9fefa6bd3299ce';
    const LANG = 'es-AR';
    const IMG_BASE = 'https://image.tmdb.org/t/p/w500';

    const PLATFORMS = [
        { name: 'Netflix', id: 8, logo: 'https://upload.wikimedia.org/wikipedia/commons/0/08/Netflix_2015_logo.svg' },
        { name: 'Disney+', id: 337, logo: 'https://upload.wikimedia.org/wikipedia/commons/3/3e/Disney%2B_logo.svg' },
        { name: 'Prime Video', id: 119, logo: 'https://upload.wikimedia.org/wikipedia/commons/1/11/Amazon_Prime_Video_logo.svg' },
        { name: 'Max', id: 384, logo: 'https://upload.wikimedia.org/wikipedia/commons/c/ce/Max_logo.svg' },
        { name: 'Flow', id: 'flow', logo: 'https://upload.wikimedia.org/wikipedia/commons/2/21/Logo_Flow_Argentina.png' }
    ];

    const getDate = (m) => m.release_date || m.first_air_date || "0000-00-00";

    async function handleSearch(e) {
        const query = e.target.value.trim().toLowerCase();
        if (query.length < 3) return;
        
        const container = document.getElementById('main-container');
        container.innerHTML = `<div class="section-title">Resultados</div><div class="grid" id="s-grid"></div>`;
        
        const data = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${TMDB_KEY}&query=${encodeURIComponent(query)}&language=${LANG}`).then(r => r.json());
        
        const uniqueItems = new Map();
        
        for (let item of data.results) {
            const title = (item.title || item.name || "").toLowerCase();
            
            // Búsqueda por frase exacta y existencia de poster
            if (item.poster_path && title.includes(query)) {
                let logosHtml = "";

                if (title.includes("el resto bien")) {
                    logosHtml = `<img src="${PLATFORMS.find(x => x.id === 'flow').logo}" class="mini-logo" alt="Flow">`;
                } else {
                    const pResp = await fetch(`https://api.themoviedb.org/3/${item.media_type}/${item.id}/watch/providers?api_key=${TMDB_KEY}`).then(r => r.json());
                    const providers = pResp.results?.AR?.flatrate || [];
                    logosHtml = PLATFORMS.filter(p => providers.some(f => f.provider_id === p.id))
                                     .map(p => `<img src="${p.logo}" class="mini-logo">`).join('');
                }

                // Filtrar por plataformas autorizadas y evitar duplicados
                if (logosHtml !== "" && !uniqueItems.has(item.id)) {
                    item.customLogos = logosHtml;
                    uniqueItems.set(item.id, item);
                }
            }
        }

        // Orden cronológico descendente
        const sorted = Array.from(uniqueItems.values()).sort((a, b) => new Date(getDate(b)) - new Date(getDate(a)));
        const grid = document.getElementById('s-grid');

        if (sorted.length === 0) {
            container.innerHTML = `<p style="text-align:center; padding:50px">No disponible en las plataformas seleccionadas.</p>`;
        } else {
            sorted.forEach(item => grid.appendChild(createCard(item, item.customLogos)));
        }
    }

    function createCard(m, logos = '') {
        const card = document.createElement('div');
        card.className = 'item-card';
        const date = getDate(m);
        const year = date !== "0000-00-00" ? date.split('-') : 'S/D';
        card.innerHTML = `
            <img class="poster" src="${IMG_BASE}${m.poster_path}" alt="${m.title || m.name}">
            <div class="item-info">
                <p class="item-title">${m.title || m.name}</p>
                <p class="item-date">📅 ${year}</p>
                <div class="provider-row">${logos}</div>
            </div>`;
        return card;
    }
</script>
</body>
</html>
