<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamVault 2026 - Ultimate IA Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #05080a; --surface: #0f1520; --border: rgba(255,255,255,0.07); 
            --text: #f0f4ff; --accent: #4f8ef7; --gemini: #8E75FF; 
            --search-green: #142514; --neon-green: #2ecc71; --mood-gold: #f1c40f;
        }
        body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); margin: 0; overflow-x: hidden; }
        
        header { position: sticky; top: 0; background: rgba(5,8,10,0.95); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); padding: 15px 30px; display: flex; align-items: center; justify-content: space-between; z-index: 100; }
        .logo { font-family: 'Bebas Neue', sans-serif; font-size: 1.8rem; letter-spacing: 2px; cursor: pointer; }
        .logo span { color: var(--neon-green); }
        
        /* BUSCADOR NEÓN */
        .search-wrap { flex: 1; max-width: 450px; margin: 0 20px; }
        input#search-input { 
            width: 100%; padding: 12px 20px; border-radius: 12px; border: 2px solid var(--neon-green); 
            background: var(--search-green); color: white; outline: none; font-weight: 600;
            box-shadow: 0 0 15px rgba(46, 204, 113, 0.15); transition: 0.3s;
        }

        /* BARRA DE MOODS */
        .mood-bar { display: flex; justify-content: center; gap: 15px; padding: 20px; background: rgba(255,255,255,0.02); border-bottom: 1px solid var(--border); overflow-x: auto; }
        .mood-btn { padding: 8px 16px; border-radius: 20px; border: 1px solid var(--border); background: var(--surface); color: white; cursor: pointer; white-space: nowrap; transition: 0.3s; font-size: 0.85rem; }
        .mood-btn:hover { border-color: var(--mood-gold); background: rgba(241, 196, 15, 0.1); }

        .container { max-width: 1300px; margin: 20px auto; padding: 0 20px; }
        
        .section-title { font-family: 'Bebas Neue', sans-serif; font-size: 2rem; letter-spacing: 2px; margin: 40px 0 20px; color: var(--text); display: flex; align-items: center; gap: 15px; }
        .section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 25px; margin-bottom: 50px; }

        /* TARJETAS */
        .item-card { background: var(--surface); border-radius: 15px; overflow: hidden; position: relative; transition: 0.3s; border: 1px solid var(--border); }
        .item-card:hover { transform: scale(1.04); border-color: var(--neon-green); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .poster { width: 100%; aspect-ratio: 2/3; object-fit: cover; cursor: pointer; }
        
        /* BOTONES EN TARJETA */
        .card-actions { position: absolute; top: 10px; right: 10px; display: flex; flex-direction: column; gap: 8px; z-index: 10; }
        .action-btn { width: 35px; height: 35px; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.3s; box-shadow: 0 4px 10px rgba(0,0,0,0.4); }
        .ia-btn { background: var(--gemini); color: white; }
        .fav-btn { background: rgba(0,0,0,0.6); color: white; backdrop-filter: blur(5px); }
        .fav-btn.active { color: #e74c3c; background: white; }

        /* LOGOS GRANDES EN BÚSQUEDA */
        .provider-row { display: flex; gap: 10px; margin-top: 12px; }
        .mini-logo { height: 35px; width: 60px; border-radius: 6px; object-fit: contain; background: white; padding: 4px; border: 1px solid #ddd; }

        /* BOTONES HEADER */
        .header-btns { display: flex; gap: 10px; }
        .special-btn { padding: 10px 18px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: white; cursor: pointer; font-weight: 600; font-size: 0.8rem; display: flex; align-items: center; gap: 8px; }
        .btn-ruleta { border-color: var(--mood-gold); color: var(--mood-gold); }
        .btn-boveda { border-color: var(--accent); color: var(--accent); }

        /* MODALES */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: var(--surface); border: 1px solid var(--gemini); border-radius: 20px; width: 100%; max-width: 400px; max-height: 80vh; display: flex; flex-direction: column; overflow: hidden; }
        .modal-header { background: var(--gemini); padding: 15px; font-weight: bold; display: flex; justify-content: space-between; }

        /* ANIMACIÓN RULETA */
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .spinning { animation: spin 0.5s linear infinite; }
    </style>
</head>
<body>

<header>
    <div class="logo" onclick="location.reload()">Stream<span>Vault</span></div>
    <div class="search-wrap">
        <input type="text" id="search-input" placeholder="Buscar películas o series..." onkeyup="handleSearch(event)">
    </div>
    <div class="header-btns">
        <button class="special-btn btn-ruleta" onclick="ruletaMagica()">🎰 Ruleta</button>
        <button class="special-btn btn-boveda" onclick="verBoveda()">📁 Mi Bóveda</button>
    </div>
</header>

<div class="mood-bar">
    <button class="mood-btn" onclick="filterByMood('comedy', '😂 Para no pensar')">😂 Para no pensar</button>
    <button class="mood-btn" onclick="filterByMood('thriller', '🤯 Volar la cabeza')">🤯 Volar la cabeza</button>
    <button class="mood-btn" onclick="filterByMood('drama', '😭 Necesito llorar')">😭 Necesito llorar</button>
    <button class="mood-btn" onclick="filterByMood('action', '🔥 Adrenalina')">🔥 Adrenalina</button>
    <button class="mood-btn" onclick="filterByMood('scifi', '🚀 Otros mundos')">🚀 Otros mundos</button>
</div>

<main class="container" id="main-container"></main>

<div class="modal" id="chat-modal">
    <div class="modal-content">
        <div class="modal-header"><span>Gemini AI</span><span onclick="closeModal('chat-modal')" style="cursor:pointer">✕</span></div>
        <div id="chat-body" style="padding:20px; overflow-y:auto; font-size:0.9rem; line-height:1.5;"></div>
        <div style="padding:15px; border-top:1px solid var(--border)"><input type="text" placeholder="Pregunta algo..." style="width:100%; padding:8px; background:#222; border:none; color:white; border-radius:5px;"></div>
    </div>
</div>

<script>
    const API_KEY = '5fe1eec4e7d975c66b9fefa6bd3299ce';
    const LANG = 'es-AR';
    const PLATFORMS = [
        { name: 'Netflix', id: 8, color: '#E50914', logo: 'https://upload.wikimedia.org/wikipedia/commons/0/08/Netflix_2015_logo.svg' },
        { name: 'Disney+', id: 337, color: '#006E99', logo: 'https://upload.wikimedia.org/wikipedia/commons/3/3e/Disney%2B_logo.svg' },
        { name: 'Prime Video', id: 119, color: '#00A8E1', logo: 'https://upload.wikimedia.org/wikipedia/commons/1/11/Amazon_Prime_Video_logo.svg' },
        { name: 'Max', id: 384, color: '#8B5CF6', logo: 'https://upload.wikimedia.org/wikipedia/commons/c/ce/Max_logo.svg' }
    ];

    let boveda = JSON.parse(localStorage.getItem('streamvault_favs')) || [];

    function showPlatforms() {
        const container = document.getElementById('main-container');
        container.innerHTML = `<div class="section-title">Explorar Plataformas</div><div class="grid" id="p-grid"></div>`;
        PLATFORMS.forEach(p => {
            const card = document.createElement('div');
            card.className = 'platform-card';
            card.style.setProperty('--p-color', p.color);
            card.onclick = () => loadCatalog(p);
            card.innerHTML = `<img src="${p.logo}">`;
            document.getElementById('p-grid').appendChild(card);
        });
    }

    async function loadCatalog(p) {
        const container = document.getElementById('main-container');
        container.innerHTML = `<p style="text-align:center; padding:50px">Cargando ${p.name}...</p>`;
        const [m, t] = await Promise.all([
            fetch(`https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_watch_providers=${p.id}&watch_region=AR&language=${LANG}`).then(r => r.json()),
            fetch(`https://api.themoviedb.org/3/discover/tv?api_key=${API_KEY}&with_watch_providers=${p.id}&watch_region=AR&language=${LANG}`).then(r => r.json())
        ]);
        container.innerHTML = `<div class="section-title">Series en ${p.name}</div><div class="grid" id="t-grid"></div><div class="section-title">Películas en ${p.name}</div><div class="grid" id="m-grid"></div>`;
        renderItems(t.results.map(x=>({...x, title:x.name})), 't-grid');
        renderItems(m.results, 'm-grid');
    }

    async function handleSearch(e) {
        const q = e.target.value.trim();
        if (q.length < 3) { if(q.length===0) showPlatforms(); return; }
        const container = document.getElementById('main-container');
        container.innerHTML = `<div class="section-title">Resultados para "${q}"</div><div class="grid" id="s-grid"></div>`;
        const data = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${API_KEY}&query=${q}&language=${LANG}`).then(r => r.json());
        
        for(let item of data.results) {
            if(!item.poster_path) continue;
            const provs = await fetch(`https://api.themoviedb.org/3/${item.media_type}/${item.id}/watch/providers?api_key=${API_KEY}`).then(r=>r.json());
            const flatrate = provs.results?.AR?.flatrate || [];
            const logos = PLATFORMS.filter(p => flatrate.some(f => f.provider_id === p.id)).map(p => `<img src="${p.logo}" class="mini-logo">`).join('');
            
            const card = createCard(item, logos);
            document.getElementById('s-grid').appendChild(card);
        }
    }

    async function filterByMood(genre, label) {
        const genreMap = { comedy: 35, thriller: 53, drama: 18, action: 28, scifi: 878 };
        const container = document.getElementById('main-container');
        container.innerHTML = `<div class="section-title">${label}</div><div class="grid" id="mood-grid"></div>`;
        const data = await fetch(`https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_genres=${genreMap[genre]}&language=${LANG}`).then(r => r.json());
        renderItems(data.results, 'mood-grid');
    }

    function createCard(m, extraHtml = '') {
        const isFav = boveda.some(f => f.id === m.id);
        const card = document.createElement('div');
        card.className = 'item-card';
        card.innerHTML = `
            <div class="card-actions">
                <button class="action-btn ia-btn" onclick="askGemini('${m.title || m.name}')">✦</button>
                <button class="action-btn fav-btn ${isFav?'active':''}" onclick="toggleFav(this, ${JSON.stringify(m).replace(/"/g, '&quot;')})">❤</button>
            </div>
            <img class="poster" src="https://image.tmdb.org/t/p/w500${m.poster_path}">
            <div class="item-info">
                <p class="item-title">${m.title || m.name}</p>
                <div class="provider-row">${extraHtml}</div>
            </div>`;
        return card;
    }

    function renderItems(data, gridId) {
        const grid = document.getElementById(gridId);
        data.forEach(m => grid.appendChild(createCard(m)));
    }

    function toggleFav(btn, m) {
        const idx = boveda.findIndex(f => f.id === m.id);
        if(idx > -1) { boveda.splice(idx, 1); btn.classList.remove('active'); }
        else { boveda.push(m); btn.classList.add('active'); }
        localStorage.setItem('streamvault_favs', JSON.stringify(boveda));
    }

    function verBoveda() {
        const container = document.getElementById('main-container');
        container.innerHTML = `<div class="section-title">Mi Bóveda (Pendientes)</div><div class="grid" id="b-grid"></div>`;
        if(boveda.length === 0) container.innerHTML += '<p style="text-align:center">No hay nada en tu bóveda todavía.</p>';
        boveda.forEach(m => document.getElementById('b-grid').appendChild(createCard(m)));
    }

    async function ruletaMagica() {
        const btn = document.querySelector('.btn-ruleta');
        btn.classList.add('spinning');
        const data = await fetch(`https://api.themoviedb.org/3/movie/popular?api_key=${API_KEY}&language=${LANG}`).then(r => r.json());
        const random = data.results[Math.floor(Math.random() * data.results.length)];
        setTimeout(() => {
            btn.classList.remove('spinning');
            askGemini(random.title, true);
        }, 1000);
    }

    function askGemini(title, isRuleta = false) {
        const modal = document.getElementById('chat-modal');
        modal.style.display = 'flex';
        const msg = isRuleta ? `🎰 LA RULETA ELIGIÓ: <b>${title}</b><br><br>Gemini dice: "Esta es la opción perfecta para vos hoy. ¿Querés saber por qué es tendencia?"` : 
                               `✦ Analizando <b>${title}</b>...<br><br>Gemini dice: "Tiene una puntuación increíble. Puedo decirte si tiene escenas post-créditos o si el final es tan polémico como dicen."`;
        document.getElementById('chat-body').innerHTML = msg;
    }

    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    showPlatforms();
</script>
</body>
</html>
