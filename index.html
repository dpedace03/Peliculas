<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamVault 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #080c12; --surface: #0f1520; --surface2: #161e2e;
            --border: rgba(255,255,255,0.07); --text: #f0f4ff;
            --muted: #6b7a99; --accent: #4f8ef7;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
        body::before {
            content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
            background-image: linear-gradient(rgba(79,142,247,.025) 1px,transparent 1px), linear-gradient(90deg,rgba(79,142,247,.025) 1px,transparent 1px);
            background-size: 50px 50px;
        }

        /* HEADER */
        header {
            position: sticky; top: 0; z-index: 100;
            background: rgba(8,12,18,.92); backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 14px 32px; display: flex; align-items: center; gap: 20px;
        }
        .logo { font-family: 'Bebas Neue', sans-serif; font-size: 1.7rem; letter-spacing: 3px; white-space: nowrap; flex-shrink: 0; }
        .logo span { color: var(--accent); }

        .search-wrap { flex: 1; max-width: 500px; position: relative; }
        .search-wrap svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
        #search-input {
            width: 100%; padding: 11px 16px 11px 44px;
            background: var(--surface2); border: 1px solid var(--border); border-radius: 12px;
            color: var(--text); font-family: 'DM Sans', sans-serif; font-size: .95rem;
            outline: none; transition: border-color .2s, box-shadow .2s;
        }
        #search-input::placeholder { color: var(--muted); }
        #search-input:focus { border-color: rgba(79,142,247,.5); box-shadow: 0 0 0 3px rgba(79,142,247,.1); }

        #back-btn {
            display: none; align-items: center; gap: 6px; padding: 9px 18px;
            background: var(--surface2); border: 1px solid var(--border); border-radius: 10px;
            color: var(--text); font-family: 'DM Sans', sans-serif; font-size: .88rem;
            font-weight: 500; cursor: pointer; transition: all .2s; white-space: nowrap; flex-shrink: 0;
        }
        #back-btn:hover { background: var(--surface); border-color: rgba(255,255,255,.15); }

        /* MAIN */
        main { position: relative; z-index: 1; padding: 44px 32px; max-width: 1280px; margin: 0 auto; }
        .sec-title { font-family: 'Bebas Neue', sans-serif; font-size: 2.2rem; letter-spacing: 2px; margin-bottom: 6px; }
        .sec-sub { color: var(--muted); font-size: .9rem; margin-bottom: 32px; }

        /* PLATFORM GRID */
        #platform-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px,1fr)); gap: 18px; }
        .pcard {
            background: var(--surface); border: 1px solid var(--border); border-radius: 20px;
            padding: 32px 24px; cursor: pointer;
            transition: transform .25s, box-shadow .25s, border-color .25s;
            display: flex; flex-direction: column; align-items: center; gap: 18px;
            position: relative; overflow: hidden;
        }
        .pcard::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 4px; background: var(--pc); transition: height .25s; }
        .pcard:hover { transform: translateY(-6px); box-shadow: 0 20px 40px rgba(0,0,0,.4); border-color: rgba(255,255,255,.12); }
        .pcard:hover::after { height: 6px; }
        .pglow { position: absolute; inset: 0; background: radial-gradient(circle at 50% 110%, var(--pc) 0%, transparent 65%); opacity: 0; transition: opacity .3s; }
        .pcard:hover .pglow { opacity: .08; }
        .plogo { width: 130px; height: 54px; display: flex; align-items: center; justify-content: center; }
        .plogo img { max-width: 100%; max-height: 100%; object-fit: contain; filter: brightness(0) invert(1); }
        .pname { font-size: .78rem; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }

        /* MOVIES VIEW */
        #movies-view { display: none; }
        .phero {
            display: flex; align-items: center; gap: 18px; margin-bottom: 36px;
            padding: 24px 28px; background: var(--surface); border: 1px solid var(--border);
            border-radius: 18px; border-left: 5px solid var(--pc, #4f8ef7);
        }
        .phero img { height: 36px; object-fit: contain; filter: brightness(0) invert(1); }
        .phero h2 { font-family: 'Bebas Neue', sans-serif; font-size: 1.7rem; letter-spacing: 2px; }
        .phero p { color: var(--muted); font-size: .88rem; margin-top: 3px; }

        #movies-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(175px,1fr)); gap: 18px; }
        .mcard {
            background: var(--surface); border-radius: 14px; overflow: hidden;
            border: 1px solid var(--border); cursor: pointer;
            transition: transform .25s, box-shadow .25s; animation: up .4s ease both;
        }
        .mcard:hover { transform: translateY(-5px) scale(1.02); box-shadow: 0 16px 32px rgba(0,0,0,.5); }
        .mcard img { width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block; background: var(--surface2); }
        .minfo { padding: 11px 13px 14px; }
        .mtitle { font-size: .85rem; font-weight: 600; line-height: 1.3; margin-bottom: 5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .mmeta { font-size: .76rem; color: var(--muted); display: flex; align-items: center; gap: 8px; }
        .mrating { color: #f5c518; font-weight: 600; }

        /* SEARCH VIEW */
        #search-view { display: none; }
        .rcard {
            display: flex; background: var(--surface); border: 1px solid var(--border);
            border-radius: 16px; overflow: hidden; margin-bottom: 14px;
            transition: border-color .2s, transform .2s; animation: up .3s ease both;
        }
        .rcard:hover { border-color: rgba(255,255,255,.14); transform: translateX(3px); }
        .rposter { width: 85px; flex-shrink: 0; object-fit: cover; display: block; background: var(--surface2); }
        .rbody { padding: 16px 20px; flex: 1; display: flex; flex-direction: column; gap: 7px; justify-content: center; }
        .rtitle { font-size: 1.05rem; font-weight: 600; }
        .rorig { font-size: .78rem; color: var(--muted); }
        .rpills { display: flex; flex-wrap: wrap; gap: 5px; }
        .pill { font-size: .71rem; font-weight: 600; letter-spacing: .4px; padding: 3px 10px; border-radius: 20px; border: 1px solid; }
        .pill-none { color: var(--muted); border-color: var(--border); }
        .roverview { font-size: .83rem; color: var(--muted); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        .rmeta { font-size: .79rem; color: var(--muted); display: flex; align-items: center; gap: 10px; }

        /* STATES */
        @keyframes up { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
        .spinner-wrap { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 70px 0; color: var(--muted); grid-column: 1/-1; }
        .spinner { width: 38px; height: 38px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ERROR BOX — visible en pantalla */
        .err-block {
            background: rgba(192,57,43,.12); border: 1px solid rgba(192,57,43,.4);
            border-radius: 14px; padding: 24px 28px; margin-bottom: 20px;
            grid-column: 1/-1;
        }
        .err-block h3 { color: #e74c3c; font-size: 1rem; margin-bottom: 10px; }
        .err-block code { font-family: monospace; font-size: .82rem; color: #ff9999; word-break: break-all; }
        .err-block p { color: var(--muted); font-size: .85rem; margin-top: 12px; line-height: 1.5; }

        @media (max-width: 640px) {
            header { padding: 12px 16px; flex-wrap: wrap; }
            main { padding: 28px 16px; }
            .rcard { flex-direction: column; }
            .rposter { width: 100%; height: 180px; }
        }
    </style>
</head>
<body>

<header>
    <div class="logo">Stream<span>Vault</span></div>
    <div class="search-wrap">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <input type="text" id="search-input" placeholder="Buscar en todas las plataformas..." autocomplete="off">
    </div>
    <button id="back-btn" onclick="showHome()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
        Plataformas
    </button>
</header>

<main>
    <!-- HOME -->
    <div id="home-view">
        <div class="sec-title">Plataformas</div>
        <div class="sec-sub">Elegí una plataforma para explorar su catálogo</div>
        <div id="platform-grid"></div>
    </div>

    <!-- MOVIES -->
    <div id="movies-view">
        <div class="phero" id="phero">
            <img id="hero-logo" src="" alt="">
            <div><h2 id="hero-name"></h2><p id="hero-sub">Cargando...</p></div>
        </div>
        <div id="movies-grid"></div>
    </div>

    <!-- SEARCH -->
    <div id="search-view">
        <div style="margin-bottom:26px">
            <div class="sec-title" id="stitle">Resultados</div>
            <div class="sec-sub" id="ssub"></div>
        </div>
        <div id="search-results"></div>
    </div>
</main>

<script>
// ─── CONFIGURACIÓN ────────────────────────────────────────────
const API_KEY = '5fe1eec4e7d975c66b9fefa6bd3299ce';
const BASE    = 'https://api.themoviedb.org/3';
const IMG     = 'https://image.tmdb.org/t/p/w342';
const LANG    = 'es-AR';

const PLATFORMS = [
    { id:'netflix', name:'Netflix',      pid:8,   color:'#E50914', logo:'https://upload.wikimedia.org/wikipedia/commons/0/08/Netflix_2015_logo.svg' },
    { id:'disney',  name:'Disney+',      pid:337, color:'#006E99', logo:'https://upload.wikimedia.org/wikipedia/commons/3/3e/Disney%2B_logo.svg' },
    { id:'prime',   name:'Prime Video',  pid:119, color:'#00A8E1', logo:'https://upload.wikimedia.org/wikipedia/commons/1/11/Amazon_Prime_Video_logo.svg' },
    { id:'max',     name:'Max',           pid:384, color:'#8B5CF6', logo:'https://upload.wikimedia.org/wikipedia/commons/c/ce/Max_logo.svg' },
];

let searchTimer = null;

// ─── FETCH HELPER ─────────────────────────────────────────────
async function tmdb(path, params={}) {
    const url = new URL(BASE + path);
    url.searchParams.set('api_key', API_KEY);
    url.searchParams.set('language', LANG);
    Object.entries(params).forEach(([k,v]) => url.searchParams.set(k, v));
    const r = await fetch(url.toString());
    const json = await r.json();
    // TMDB devuelve status_message en errores
    if (!r.ok || json.status_code) {
        throw new Error(json.status_message || `HTTP ${r.status}`);
    }
    return json;
}

// ─── ERROR BLOCK ──────────────────────────────────────────────
function errBlock(err) {
    return `<div class="err-block" style="grid-column:1/-1">
        <h3>⚠ Error al conectar con TMDB</h3>
        <code>${err.message || err}</code>
        <p>Posibles causas:
        <br>• La API Key no es válida o expiró
        <br>• El archivo se está abriendo como <strong>file://</strong> en lugar de un servidor local (Chrome bloquea fetch en file://)
        <br>• No hay conexión a Internet
        <br><br>Solución rápida: abrí una terminal en la carpeta del archivo y ejecutá:<br>
        <code>python3 -m http.server 8080</code><br>
        Luego abrí <strong>http://localhost:8080</strong> en el navegador.</p>
    </div>`;
}

// ─── SPINNER ──────────────────────────────────────────────────
function spinnerHTML(msg='Cargando...') {
    return `<div class="spinner-wrap"><div class="spinner"></div><span>${msg}</span></div>`;
}

// ─── NAVEGACIÓN ───────────────────────────────────────────────
function showView(v) {
    document.getElementById('home-view').style.display   = v==='home'   ? '' : 'none';
    document.getElementById('movies-view').style.display = v==='movies' ? '' : 'none';
    document.getElementById('search-view').style.display = v==='search' ? '' : 'none';
    document.getElementById('back-btn').style.display    = v!=='home'   ? 'flex' : 'none';
}

function showHome() {
    document.getElementById('search-input').value = '';
    clearTimeout(searchTimer);
    showView('home');
}

// ─── RENDER PLATAFORMAS ───────────────────────────────────────
function renderPlatforms() {
    const grid = document.getElementById('platform-grid');
    PLATFORMS.forEach(p => {
        const c = document.createElement('div');
        c.className = 'pcard';
        c.style.cssText = `--pc:${p.color}`;
        c.onclick = () => loadMovies(p);
        c.innerHTML = `
            <div class="pglow"></div>
            <div class="plogo"><img src="${p.logo}" alt="${p.name}"></div>
            <div class="pname">${p.name}</div>`;
        grid.appendChild(c);
    });
}

// ─── CARGAR CATÁLOGO ──────────────────────────────────────────
async function loadMovies(p) {
    showView('movies');

    const hero = document.getElementById('phero');
    hero.style.cssText = `--pc:${p.color}; border-left-color:${p.color}`;
    document.getElementById('hero-logo').src = p.logo;
    document.getElementById('hero-name').textContent = p.name;
    document.getElementById('hero-sub').textContent = 'Cargando...';

    const grid = document.getElementById('movies-grid');
    grid.innerHTML = spinnerHTML('Buscando películas...');

    try {
        // Intentamos con discover + watch_providers en varias regiones
        const seen = new Set();
        let movies = [];
        for (const region of ['AR','US','MX','ES','BR']) {
            try {
                const data = await tmdb('/discover/movie', {
                    sort_by: 'popularity.desc',
                    with_watch_providers: p.pid,
                    watch_region: region,
                    page: 1
                });
                for (const m of (data.results||[])) {
                    if (m.poster_path && !seen.has(m.id)) { seen.add(m.id); movies.push(m); }
                }
            } catch(e) { /* región sin resultados, continuar */ }
            if (movies.length >= 20) break;
        }

        // Fallback: popular general si no hay resultados con providers
        if (movies.length === 0) {
            const fallback = await tmdb('/movie/popular', { page: 1 });
            movies = (fallback.results||[]).filter(m=>m.poster_path);
            document.getElementById('hero-sub').textContent = `No encontramos catálogo específico — mostrando populares`;
        } else {
            document.getElementById('hero-sub').textContent = `${movies.length} títulos`;
        }

        grid.innerHTML = '';
        movies.forEach((m, i) => {
            const yr   = m.release_date?.split('-')[0] ?? '';
            const rat  = m.vote_average > 0 ? m.vote_average.toFixed(1) : null;
            const card = document.createElement('div');
            card.className = 'mcard';
            card.style.animationDelay = Math.min(i*.04,.6)+'s';
            card.innerHTML = `
                <img src="${IMG}${m.poster_path}" alt="${m.title}" loading="lazy">
                <div class="minfo">
                    <div class="mtitle">${m.title}</div>
                    <div class="mmeta">
                        ${yr ? `<span>${yr}</span>` : ''}
                        ${rat ? `<span class="mrating">★ ${rat}</span>` : ''}
                    </div>
                </div>`;
            grid.appendChild(card);
        });

    } catch(err) {
        document.getElementById('hero-sub').textContent = 'Error';
        grid.innerHTML = errBlock(err);
    }
}

// ─── BÚSQUEDA ─────────────────────────────────────────────────
function setupSearch() {
    document.getElementById('search-input').addEventListener('input', function(){
        const q = this.value.trim();
        clearTimeout(searchTimer);
        if (!q) { showHome(); return; }
        if (q.length < 2) return;
        searchTimer = setTimeout(() => runSearch(q), 500);
    });
}

async function runSearch(query) {
    showView('search');
    document.getElementById('stitle').textContent = `"${query}"`;
    document.getElementById('ssub').textContent = 'Buscando...';

    const cont = document.getElementById('search-results');
    cont.innerHTML = spinnerHTML('Buscando en TMDB...');

    try {
        const data = await tmdb('/search/movie', { query, page:1 });
        const movies = (data.results||[]).filter(m=>m.poster_path).slice(0,20);

        if (!movies.length) {
            document.getElementById('ssub').textContent = 'Sin resultados';
            cont.innerHTML = `<div style="padding:60px 0;text-align:center;color:var(--muted);">
                <div style="font-size:2.5rem;margin-bottom:12px">🎬</div>
                <p>No encontramos "${query}"</p></div>`;
            return;
        }

        document.getElementById('ssub').textContent = 'Verificando disponibilidad en plataformas...';
        cont.innerHTML = spinnerHTML('Consultando plataformas...');

        // Para cada película buscar en qué plataformas está disponible
        const enriched = await Promise.all(movies.map(async m => {
            try {
                const pd = await tmdb(`/movie/${m.id}/watch/providers`);
                const all = [
                    ...((pd.results?.AR||{}).flatrate||[]),
                    ...((pd.results?.US||{}).flatrate||[]),
                    ...((pd.results?.MX||{}).flatrate||[]),
                ];
                const found = PLATFORMS
                    .filter(p => all.some(f=>f.provider_id===p.pid))
                    .filter((p,i,a) => a.findIndex(x=>x.id===p.id)===i);
                return {...m, platforms:found};
            } catch { return {...m, platforms:[]}; }
        }));

        document.getElementById('ssub').textContent =
            `${enriched.length} resultado${enriched.length!==1?'s':''} encontrado${enriched.length!==1?'s':''}`;

        cont.innerHTML = '';
        enriched.forEach((m, i) => {
            const yr  = m.release_date?.split('-')[0] ?? '';
            const rat = m.vote_average > 0 ? m.vote_average.toFixed(1) : null;
            const pills = m.platforms.length
                ? m.platforms.map(p=>`<span class="pill" style="color:${p.color};border-color:${p.color}40;background:${p.color}15">${p.name}</span>`).join('')
                : `<span class="pill pill-none">No encontrada en streaming</span>`;

            const card = document.createElement('div');
            card.className = 'rcard';
            card.style.animationDelay = Math.min(i*.04,.6)+'s';
            card.innerHTML = `
                <img class="rposter" src="${IMG}${m.poster_path}" alt="${m.title}" loading="lazy">
                <div class="rbody">
                    <div>
                        <div class="rtitle">${m.title}</div>
                        ${m.original_title && m.original_title!==m.title ? `<div class="rorig">${m.original_title}</div>` : ''}
                    </div>
                    <div class="rmeta">
                        ${yr ? `<span>${yr}</span>` : ''}
                        ${rat ? `<span class="mrating">★ ${rat}</span>` : ''}
                    </div>
                    <div class="rpills">${pills}</div>
                    <div class="roverview">${m.overview||'Sin descripción disponible.'}</div>
                </div>`;
            cont.appendChild(card);
        });

    } catch(err) {
        cont.innerHTML = errBlock(err);
    }
}

// ─── INICIO ───────────────────────────────────────────────────
renderPlatforms();
setupSearch();
</script>
</body>
</html>
