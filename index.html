<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamVault 2026 - IA Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #05080a; --surface: #0f1520; --border: rgba(255,255,255,0.1); 
            --text: #f0f4ff; --accent: #4f8ef7; --gemini: #8E75FF; 
            --search-green: #1a2e1a; --neon-green: #2ecc71;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); overflow-x: hidden; }

        /* ── HEADER ── */
        header { 
            position: sticky; top: 0; background: rgba(5,8,10,0.97); backdrop-filter: blur(20px); 
            border-bottom: 1px solid var(--border); padding: 14px 30px; 
            display: flex; align-items: center; justify-content: space-between; z-index: 100; gap: 20px;
        }
        .logo { font-family: 'Bebas Neue', sans-serif; font-size: 1.35rem; letter-spacing: 1.5px; cursor: pointer; flex-shrink: 0; }
        .logo span { color: var(--neon-green); }
        .search-wrap { flex: 1; max-width: 500px; position: relative; }
        input#search-input { 
            width: 100%; padding: 11px 42px 11px 20px; border-radius: 12px; border: 2px solid var(--neon-green); 
            background: var(--search-green); color: white; outline: none; font-size: 1rem;
            box-shadow: 0 0 15px rgba(46,204,113,0.2); font-family: 'DM Sans', sans-serif;
        }
        input#search-input::placeholder { color: rgba(255,255,255,0.4); }
        #search-spinner { display: none; position: absolute; right: 14px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; border: 2px solid rgba(46,204,113,0.3); border-top-color: var(--neon-green); border-radius: 50%; animation: spinInline 0.7s linear infinite; }
        @keyframes spinInline { to { transform: translateY(-50%) rotate(360deg); } }

        /* ── MOOD BAR ── */
        .mood-bar { display: flex; justify-content: center; gap: 12px; padding: 14px 20px; background: rgba(255,255,255,0.025); overflow-x: auto; scrollbar-width: none; }
        .mood-bar::-webkit-scrollbar { display: none; }
        .mood-btn { padding: 7px 16px; border-radius: 20px; border: 1px solid var(--border); background: var(--surface); color: white; cursor: pointer; white-space: nowrap; transition: 0.25s; font-family: 'DM Sans', sans-serif; font-size: 0.88rem; }
        .mood-btn:hover, .mood-btn.active { border-color: var(--neon-green); background: rgba(46,204,113,0.12); color: var(--neon-green); }
        .mood-btn--topten { border-color: #f5c518; color: #f5c518; background: rgba(245,197,24,0.08); font-weight: 700; }
        .mood-btn--topten:hover, .mood-btn--topten.active { border-color: #f5c518; background: rgba(245,197,24,0.18); color: #f5c518; }

        /* ── RANKING BADGE ── */
        .rank-badge {
            position: absolute; top: 0; left: 0;
            width: 36px; height: 36px;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Bebas Neue', sans-serif; font-size: 1.1rem; font-weight: 700;
            border-radius: 14px 0 10px 0;
            z-index: 5; pointer-events: none;
        }
        .rank-1  { background: linear-gradient(135deg,#b8860b,#ffd700); color: #000; font-size: 1.2rem; }
        .rank-2  { background: linear-gradient(135deg,#7a7a7a,#c0c0c0); color: #000; }
        .rank-3  { background: linear-gradient(135deg,#7a4a1e,#cd7f32); color: #fff; }
        .rank-other { background: rgba(0,0,0,0.65); color: rgba(255,255,255,0.85); font-size: 0.95rem; }

        /* TOP TEN: grid más grande para los primeros 3 */
        .topten-podium {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 22px; margin-bottom: 14px;
        }
        .topten-podium .item-card .poster { aspect-ratio: 16/9; object-fit: cover; }
        .topten-podium .rank-badge { width: 44px; height: 44px; font-size: 1.4rem; }
        .topten-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; margin-bottom: 40px; }

        /* Separador de sección TOP TEN */
        .topten-divider {
            font-family: 'Bebas Neue', sans-serif; font-size: 1rem; letter-spacing: 3px;
            color: rgba(255,255,255,0.25); text-align: center; padding: 4px 0 16px;
        }
        .no-platform-msg {
            text-align: center; padding: 60px 20px; color: rgba(255,255,255,0.3);
            font-size: 0.95rem; line-height: 1.8;
        }

        /* ── CONTENEDOR ── */
        .container { max-width: 1300px; margin: 0 auto; padding: 0 24px 60px; }

        /* ── PLATAFORMAS HOME ── */
        .platforms-section { padding: 40px 0 10px; }
        .platforms-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }

        .platform-hero {
            border-radius: 20px; cursor: pointer; position: relative; overflow: hidden;
            height: 150px; display: flex; flex-direction: column; align-items: center; justify-content: center;
            border: 2px solid transparent; transition: all 0.3s ease;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        .platform-hero::before {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0) 60%);
            pointer-events: none;
        }
        .platform-hero:hover { transform: translateY(-4px); box-shadow: 0 16px 40px rgba(0,0,0,0.6); }
        .platform-hero.selected { border-color: rgba(255,255,255,0.5); box-shadow: 0 0 0 3px rgba(255,255,255,0.15), 0 16px 40px rgba(0,0,0,0.6); }
        .platform-hero img { max-width: 70%; max-height: 52px; filter: brightness(0) invert(1); object-fit: contain; }
        .platform-hero .p-name { margin-top: 10px; font-size: 0.75rem; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; opacity: 0.7; }
        .platform-hero .p-arrow { position: absolute; bottom: 10px; right: 14px; font-size: 0.8rem; opacity: 0; transition: opacity 0.2s; }
        .platform-hero:hover .p-arrow, .platform-hero.selected .p-arrow { opacity: 0.6; }
        .platform-hero.selected .p-arrow { content: '▲'; }

        /* ── SECCIÓN TÍTULOS ── */
        .section-title { font-family: 'Bebas Neue', sans-serif; font-size: 1.9rem; letter-spacing: 2px; margin: 36px 0 18px; color: var(--text); display: flex; align-items: center; gap: 15px; }
        .section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }
        .section-subtitle { font-size: 0.8rem; font-weight: 400; color: rgba(255,255,255,0.4); letter-spacing: 0; font-family: 'DM Sans', sans-serif; text-transform: none; }

        /* ── GRID TARJETAS ── */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; margin-bottom: 10px; }

        .item-card { background: var(--surface); border-radius: 14px; overflow: hidden; position: relative; border: 1px solid var(--border); transition: transform 0.2s, box-shadow 0.2s; display: flex; flex-direction: column; cursor: pointer; }
        .item-card:hover { transform: translateY(-4px); box-shadow: 0 12px 32px rgba(0,0,0,0.5); }
        .poster { width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block; background: #0a0e18; }
        .item-info { padding: 10px 12px 12px; flex-grow: 1; display: flex; flex-direction: column; }
        .item-title { font-size: 0.85rem; font-weight: 600; margin-bottom: 4px; line-height: 1.3; }
        .item-year { font-size: 0.75rem; color: rgba(255,255,255,0.35); margin-bottom: 8px; }
        .provider-row { display: flex; gap: 5px; flex-wrap: wrap; margin-top: auto; padding-top: 8px; min-height: 28px; align-items: center; }
        .mini-logo { height: 24px; width: 48px; border-radius: 4px; object-fit: contain; background: white; padding: 2px 4px; }
        .no-platform-tag { font-size: 0.68rem; color: rgba(255,255,255,0.22); font-style: italic; }
        .ia-btn { position: absolute; top: 7px; right: 7px; background: var(--gemini); color: white; border: none; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-size: 0.9rem; z-index: 10; box-shadow: 0 3px 10px rgba(0,0,0,0.4); transition: 0.2s; }
        .ia-btn:hover { transform: scale(1.15); }
        .fav-btn { position: absolute; top: 7px; left: 7px; background: rgba(0,0,0,0.55); color: rgba(255,255,255,0.6); border: none; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-size: 0.95rem; z-index: 10; transition: 0.2s; display: flex; align-items: center; justify-content: center; }
        .fav-btn:hover { background: rgba(245,197,24,0.25); color: #f5c518; transform: scale(1.15); }
        .fav-btn.saved { background: rgba(245,197,24,0.2); color: #f5c518; }
        #detail-save-btn { align-self: flex-start; background: rgba(245,197,24,0.12); color: #f5c518; border: 1px solid rgba(245,197,24,0.35); padding: 10px 20px; border-radius: 10px; cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 0.88rem; font-weight: 600; display: flex; align-items: center; gap: 7px; transition: 0.2s; }
        #detail-save-btn:hover { background: rgba(245,197,24,0.22); }
        #detail-save-btn.saved { background: rgba(245,197,24,0.25); border-color: #f5c518; }
        .boveda-remove-btn { position: absolute; top: 7px; left: 7px; background: rgba(220,50,50,0.7); color: white; border: none; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-size: 0.85rem; z-index: 10; transition: 0.2s; display: flex; align-items: center; justify-content: center; }
        .boveda-remove-btn:hover { background: rgba(220,50,50,1); transform: scale(1.1); }

        /* ── DETAIL OVERLAY ── */
        #detail-overlay {
            position: fixed; inset: 0; z-index: 900;
            display: none; align-items: center; justify-content: center;
            padding: 24px;
        }
        #detail-overlay.open { display: flex; }
        #detail-backdrop {
            position: absolute; inset: 0;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(10px);
        }
        #detail-card {
            position: relative; z-index: 1;
            background: #0d1625;
            border-radius: 22px;
            border: 1px solid rgba(255,255,255,0.12);
            box-shadow: 0 30px 80px rgba(0,0,0,0.8);
            width: 100%; max-width: 700px;
            display: flex; overflow: hidden;
            animation: detailIn 0.35s cubic-bezier(0.34,1.4,0.64,1) forwards;
            max-height: 90vh;
        }
        @keyframes detailIn {
            from { transform: scale(0.85) translateY(24px); opacity: 0; }
            to   { transform: scale(1) translateY(0); opacity: 1; }
        }
        #detail-poster {
            width: 230px; min-width: 230px; object-fit: cover;
            display: block; flex-shrink: 0;
        }
        #detail-body {
            padding: 28px 28px 24px;
            display: flex; flex-direction: column; gap: 14px;
            overflow-y: auto; flex: 1; position: relative;
        }
        #detail-close {
            position: absolute; top: 14px; right: 14px;
            background: rgba(255,255,255,0.1); border: none; color: rgba(255,255,255,0.7);
            width: 30px; height: 30px; border-radius: 50%; cursor: pointer;
            font-size: 1rem; display: flex; align-items: center; justify-content: center;
            transition: background 0.2s;
        }
        #detail-close:hover { background: rgba(255,255,255,0.22); color: white; }
        #detail-title { font-family: 'Bebas Neue', sans-serif; font-size: 1.75rem; letter-spacing: 1.5px; line-height: 1.1; padding-right: 36px; }
        #detail-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .d-badge { font-size: 0.75rem; padding: 3px 10px; border-radius: 20px; }
        .d-year  { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.55); }
        .d-genre { background: rgba(79,142,247,0.12); color: var(--accent); border: 1px solid rgba(79,142,247,0.2); }
        .d-type  { background: rgba(46,204,113,0.1); color: var(--neon-green); border: 1px solid rgba(46,204,113,0.2); }
        #detail-rating { display: flex; align-items: center; gap: 10px; }
        .stars-wrap { display: flex; gap: 2px; }
        .star      { font-size: 1.05rem; }
        .star.full { color: #f5c518; }
        .star.half { color: #f5c518; opacity: 0.55; }
        .star.empty{ color: rgba(255,255,255,0.12); }
        .rating-num { font-size: 1.15rem; font-weight: 700; color: #f5c518; }
        .rating-max { font-size: 0.75rem; color: rgba(255,255,255,0.3); }
        .rating-votes { font-size: 0.72rem; color: rgba(255,255,255,0.3); }
        #detail-overview {
            font-size: 0.87rem; line-height: 1.75; color: rgba(255,255,255,0.72);
            border-left: 3px solid rgba(255,255,255,0.1); padding-left: 14px;
            font-style: italic;
        }
        #detail-providers-wrap { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .d-provider-label { font-size: 0.72rem; color: rgba(255,255,255,0.35); }
        .detail-mini-logo { height: 26px; width: 52px; border-radius: 5px; object-fit: contain; background: white; padding: 2px 5px; }
        #detail-ia-btn {
            margin-top: 4px; align-self: flex-start;
            background: var(--gemini); color: white; border: none;
            padding: 10px 20px; border-radius: 10px; cursor: pointer;
            font-family: 'DM Sans', sans-serif; font-size: 0.88rem; font-weight: 600;
            display: flex; align-items: center; gap: 7px; transition: opacity 0.2s;
        }
        #detail-ia-btn:hover { opacity: 0.85; }

        @media (max-width: 600px) {
            #detail-card { flex-direction: column; max-height: 90vh; }
            #detail-poster { width: 100%; min-width: unset; height: 200px; object-position: top; }
            #detail-body { padding: 18px 16px 20px; }
            #detail-title { font-size: 1.4rem; }
        }

        /* ── VER MÁS ── */
        .load-more-wrap { text-align: center; padding: 20px 0 10px; }
        .load-more-btn { padding: 11px 28px; border-radius: 10px; border: 1px solid var(--neon-green); background: transparent; color: var(--neon-green); cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 0.9rem; transition: 0.25s; }
        .load-more-btn:hover { background: rgba(46,204,113,0.12); }
        .load-more-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        /* ── SPINNERS ── */
        .inline-spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(46,204,113,0.2); border-top-color: var(--neon-green); border-radius: 50%; animation: sp 0.7s linear infinite; vertical-align: middle; margin-left: 8px; }
        @keyframes sp { to { transform: rotate(360deg); } }
        .big-spinner { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 60px; color: rgba(255,255,255,0.35); font-size: 0.9rem; }
        .big-spinner-ring { width: 40px; height: 40px; border: 3px solid rgba(46,204,113,0.15); border-top-color: var(--neon-green); border-radius: 50%; animation: sp 0.8s linear infinite; }

        /* ── BANNER INFO ── */
        .info-banner { background: rgba(79,142,247,0.07); border: 1px solid rgba(79,142,247,0.2); border-radius: 10px; padding: 10px 16px; font-size: 0.8rem; color: var(--accent); margin: 16px 0; line-height: 1.5; }
        .result-count { font-size: 0.8rem; color: rgba(255,255,255,0.35); margin-bottom: 12px; }

        /* ── MODAL CHAT ── */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.88); z-index: 1000; display: none; align-items: center; justify-content: center; }
        .modal-content { background: var(--surface); border-radius: 20px; width: 92%; max-width: 440px; height: 78vh; display: flex; flex-direction: column; border: 1px solid var(--gemini); box-shadow: 0 20px 60px rgba(0,0,0,0.6); }
        .chat-header { background: var(--gemini); padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; font-weight: 600; border-radius: 20px 20px 0 0; font-size: 0.95rem; }
        #chat-body { flex: 1; padding: 16px; overflow-y: auto; background: #080c12; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px 14px; border-radius: 12px; font-size: 0.88rem; max-width: 82%; line-height: 1.55; }
        .msg.bot { background: #1a2130; align-self: flex-start; }
        .msg.user { background: var(--gemini); align-self: flex-end; }
        .chat-input-row { padding: 12px; background: var(--surface); display: flex; gap: 8px; border-radius: 0 0 20px 20px; border-top: 1px solid var(--border); }
        .chat-input-row input { flex: 1; padding: 10px 14px; border-radius: 8px; border: 1px solid #2a2f3a; background: #111520; color: white; outline: none; font-family: 'DM Sans', sans-serif; font-size: 0.9rem; }
        .chat-input-row button { padding: 10px 16px; border-radius: 8px; border: none; background: var(--gemini); color: white; cursor: pointer; font-weight: 700; font-size: 1rem; transition: 0.2s; }
        .chat-input-row button:hover { opacity: 0.85; }

        @media (max-width: 768px) {
            .platforms-grid { grid-template-columns: repeat(2, 1fr); gap: 14px; }
            .platform-hero { height: 120px; }
        }
        @media (max-width: 500px) {
            header { flex-wrap: wrap; padding: 12px 16px; }
            .search-wrap { max-width: 100%; order: 3; flex-basis: 100%; }
            .grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
            .platforms-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

<header>
    <div class="logo" onclick="goHome()">¿Qué película<span> buscás?</span></div>
    <div class="search-wrap">
        <input type="text" id="search-input" placeholder="Buscar (Ej: Once Nueva)..." oninput="handleSearch(this.value)">
        <div id="search-spinner"></div>
    </div>
    <div id="boveda-link" style="font-size:0.8rem;color:var(--accent);cursor:pointer;flex-shrink:0" onclick="verBoveda()">📁 Bóveda</div>
</header>

<div class="mood-bar">
    <button class="mood-btn mood-btn--topten" onclick="showTopTen(this)" id="btn-topten">🏆 Top Ten</button>
    <button class="mood-btn" onclick="filterByGenre(35,'😂 Comedia',this)">😂 Comedia</button>
    <button class="mood-btn" onclick="filterByGenre(18,'😭 Drama',this)">😭 Drama</button>
    <button class="mood-btn" onclick="filterByGenre(53,'🤯 Suspenso',this)">🤯 Suspenso</button>
    <button class="mood-btn" onclick="filterByGenre(28,'🔥 Acción',this)">🔥 Acción</button>
    <button class="mood-btn" onclick="filterByGenre(27,'👻 Terror',this)">👻 Terror</button>
    <button class="mood-btn" onclick="filterByGenre(16,'🎬 Animación',this)">🎬 Animación</button>
    <button class="mood-btn" onclick="filterByGenre(10749,'💕 Romance',this)">💕 Romance</button>
    <button class="mood-btn" onclick="filterByGenre(878,'🚀 Sci-Fi',this)">🚀 Sci-Fi</button>
</div>

<div class="container">

    <!-- Plataformas siempre visibles -->
    <div class="platforms-section">
        <div class="platforms-grid" id="platforms-grid"></div>
    </div>

    <!-- Contenido dinámico debajo -->
    <div id="main-content"></div>

</div>

<!-- Detail Overlay -->
<div id="detail-overlay">
    <div id="detail-backdrop" onclick="closeDetail()"></div>
    <div id="detail-card">
        <img id="detail-poster" src="" alt="">
        <div id="detail-body">
            <button id="detail-close" onclick="closeDetail()">✕</button>
            <div id="detail-title"></div>
            <div id="detail-meta"></div>
            <div id="detail-rating"></div>
            <div id="detail-overview"></div>
            <div id="detail-providers-wrap"></div>
            <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:4px;">
                <button id="detail-save-btn" onclick="toggleBovedaFromDetail()">🔖 Guardar en Bóveda</button>
                <button id="detail-ia-btn" onclick="openChatFromDetail()">✦ Preguntar a la IA</button>
            </div>
        </div>
    </div>
</div>

<div class="modal" id="chat-modal">
    <div class="modal-content">
        <div class="chat-header">
            <span id="chat-title">Asistente IA</span>
            <span onclick="closeModal()" style="cursor:pointer;font-size:1.1rem;opacity:0.6">✕</span>
        </div>
        <div id="chat-body"></div>
        <div class="chat-input-row">
            <input type="text" id="user-msg" placeholder="Preguntá algo sobre esta serie o película..." onkeypress="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()">↑</button>
        </div>
    </div>
</div>

<script>
const TMDB_KEY = '5fe1eec4e7d975c66b9fefa6bd3299ce';
const GEMINI_KEY = 'AIzaSyDaaEN0kHmLagup1S1pWNDOftZZliTENNA';
const TMDB = 'https://api.themoviedb.org/3';

const PLATFORMS = [
    { name: 'Netflix',     id: 8,   ids: [8],            color: '#E50914', gradient: 'linear-gradient(135deg,#b00610,#e50914)', logo: 'https://upload.wikimedia.org/wikipedia/commons/0/08/Netflix_2015_logo.svg' },
    { name: 'Disney+',     id: 337, ids: [337],           color: '#006E99', gradient: 'linear-gradient(135deg,#003f6b,#0083bb)', logo: 'https://upload.wikimedia.org/wikipedia/commons/3/3e/Disney%2B_logo.svg' },
    { name: 'Prime Video', id: 119, ids: [119, 9],        color: '#00A8E1', gradient: 'linear-gradient(135deg,#005f80,#00a8e1)', logo: 'https://upload.wikimedia.org/wikipedia/commons/1/11/Amazon_Prime_Video_logo.svg' },
    // Max: 384=Max global, 619=Max Latinoamérica, 1825=Max (nuevo), 118=HBO Max legacy
    { name: 'Max',         id: 384, ids: [384, 619, 1825, 118, 29], color: '#5822B4', gradient: 'linear-gradient(135deg,#2e0e73,#6b35d9)', logo: 'https://upload.wikimedia.org/wikipedia/commons/c/ce/Max_logo.svg' }
];

const providerCache = {};
let currentItem = '';
let searchTimeout = null;
let activePlatformId = null;   // plataforma seleccionada actualmente

// ── Normalizar ─────────────────────────────────────
function norm(str) {
    return (str || '').toLowerCase()
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .replace(/[^a-z0-9\s]/g, ' ')
        .replace(/\s+/g, ' ').trim();
}

// ── TMDB fetch ─────────────────────────────────────
async function tmdb(path, params = {}, lang = 'es-AR') {
    const url = new URL(`${TMDB}${path}`);
    url.searchParams.set('api_key', TMDB_KEY);
    url.searchParams.set('language', lang);
    Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v));
    try { return await (await fetch(url)).json(); }
    catch { return { results: [] }; }
}

// Fecha de hoy en formato YYYY-MM-DD para filtrar no estrenados
const TODAY = new Date().toISOString().slice(0, 10);

async function fetchPages(path, params, maxPages = 5, lang = 'es-AR') {
    // Inyectar filtro de fecha: solo títulos ya estrenados
    const filteredParams = { ...params };
    if (path.includes('/discover/movie') && !filteredParams['primary_release_date.lte']) {
        filteredParams['primary_release_date.lte'] = TODAY;
    }
    if (path.includes('/discover/tv') && !filteredParams['first_air_date.lte']) {
        filteredParams['first_air_date.lte'] = TODAY;
    }

    const all = [];
    for (let p = 1; p <= maxPages; p++) {
        const data = await tmdb(path, { ...filteredParams, page: p }, lang);
        if (!data.results?.length) break;
        all.push(...data.results);
        if (p >= (data.total_pages || 1)) break;
    }
    return all;
}

// ── Providers ──────────────────────────────────────
async function getProviders(id, type) {
    const key = `${type}-${id}`;
    if (providerCache[key] !== undefined) return providerCache[key];
    try {
        const d = await fetch(`${TMDB}/${type}/${id}/watch/providers?api_key=${TMDB_KEY}`).then(r => r.json());
        const ar = d.results?.AR?.flatrate || [];
        const matched = PLATFORMS.filter(p => {
            const ids = p.ids || [p.id];
            return ar.some(f => ids.includes(f.provider_id));
        });
        providerCache[key] = matched;
        return matched;
    } catch { providerCache[key] = []; return []; }
}

function logoHtml(p) {
    return `<img src="${p.logo}" class="mini-logo" title="${p.name}" alt="${p.name}">`;
}

async function enrichProviders(card, id, type, fallbackPlatform) {
    const platforms = await getProviders(id, type);
    const row = card.querySelector('.provider-row');
    if (!row) return;
    row.innerHTML = platforms.length > 0
        ? platforms.map(logoHtml).join('')
        : (fallbackPlatform ? logoHtml(fallbackPlatform) : '<span class="no-platform-tag">Sin datos AR</span>');
}

// ── Ordenar por fecha de estreno descendente ───────
function sortByDate(items, type) {
    return [...items].sort((a, b) => {
        const dateA = type === 'tv' ? (a.first_air_date || '') : (a.release_date || '');
        const dateB = type === 'tv' ? (b.first_air_date || '') : (b.release_date || '');
        return dateB.localeCompare(dateA);   // desc: más reciente primero
    });
}

function extractYear(item, type) {
    const raw = type === 'tv' ? item.first_air_date : item.release_date;
    return raw ? raw.slice(0, 4) : '';
}

// ── CATÁLOGO ───────────────────────────────────────
async function loadCatalog(platform) {
    const content = document.getElementById('main-content');

    // Spinner mientras carga
    content.innerHTML = `
        <div class="big-spinner">
            <div class="big-spinner-ring"></div>
            Cargando catálogo de ${platform.name}…
        </div>`;

    // Scroll suave hacia el contenido
    content.scrollIntoView({ behavior: 'smooth', block: 'start' });

    // Traer series y películas (5 páginas c/u ≈ 100 títulos)
    // Para Max usamos múltiples IDs posibles y combinamos resultados
    const providerIds = platform.ids || [platform.id];
    const movieFetches = providerIds.map(pid =>
        fetchPages('/discover/movie', { with_watch_providers: pid, watch_region: 'AR', sort_by: 'primary_release_date.desc' }, 5)
    );
    const tvFetches = providerIds.map(pid =>
        fetchPages('/discover/tv', { with_watch_providers: pid, watch_region: 'AR', sort_by: 'first_air_date.desc' }, 5)
    );
    const allMoviePages = await Promise.all(movieFetches);
    const allTvPages    = await Promise.all(tvFetches);
    const rawMovies = allMoviePages.flat();
    const rawShows  = allTvPages.flat();

    // Deduplicar y ordenar por fecha descendente
    const movies = sortByDate(dedupe(rawMovies), 'movie');
    const shows  = sortByDate(dedupe(rawShows),  'tv');

    content.innerHTML = `
        <div class="section-title">
            Series en ${platform.name}
            <span class="section-subtitle">${shows.length} títulos · por fecha de estreno</span>
        </div>
        <div class="grid" id="t-grid"></div>
        <div class="load-more-wrap" id="lm-tv"></div>

        <div class="section-title">
            Películas en ${platform.name}
            <span class="section-subtitle">${movies.length} títulos · por fecha de estreno</span>
        </div>
        <div class="grid" id="m-grid"></div>
        <div class="load-more-wrap" id="lm-movies"></div>
    `;

    renderBatch(shows,  'tv',    't-grid', 'lm-tv',     24, platform);
    renderBatch(movies, 'movie', 'm-grid', 'lm-movies', 24, platform);
}

function dedupe(items) {
    const seen = new Set();
    return items.filter(i => {
        if (!i.poster_path || seen.has(i.id)) return false;
        // Descartar títulos con fecha de estreno futura o sin fecha
        const dateRaw = i.release_date || i.first_air_date || '';
        if (!dateRaw || dateRaw > TODAY) return false;
        seen.add(i.id); return true;
    });
}

// ── Render en lotes ────────────────────────────────
function renderBatch(items, type, gridId, btnId, batchSize, fallback) {
    const grid    = document.getElementById(gridId);
    const btnWrap = document.getElementById(btnId);
    if (!grid) return;
    let offset = 0;

    function next() {
        const slice = items.slice(offset, offset + batchSize);
        offset += batchSize;

        slice.forEach(item => {
            const display = type === 'tv' ? { ...item, title: item.name } : item;
            const year = extractYear(item, type);
            const card = createCard(display, year, fallback ? logoHtml(fallback) : '<span class="no-platform-tag">Cargando…</span>');
            grid.appendChild(card);
            enrichProviders(card, item.id, type, fallback);
        });

        if (btnWrap) {
            btnWrap.innerHTML = '';
            if (offset < items.length) {
                const rem = items.length - offset;
                const btn = document.createElement('button');
                btn.className = 'load-more-btn';
                btn.textContent = `Ver más (${rem} restantes)`;
                btn.onclick = () => { btn.disabled = true; next(); };
                btnWrap.appendChild(btn);
            }
        }
    }
    next();
}

// ── BÚSQUEDA ───────────────────────────────────────
function handleSearch(raw) {
    const q = raw.trim();
    if (!q) { 
        document.getElementById('main-content').innerHTML = '';
        activePlatformId = null;
        document.querySelectorAll('.platform-hero').forEach(c => c.classList.remove('selected'));
        return;
    }
    if (q.length < 2) return;
    clearTimeout(searchTimeout);
    document.getElementById('search-spinner').style.display = 'block';
    searchTimeout = setTimeout(() => runSearch(q), 500);
}

async function runSearch(query) {
    const keywords = norm(query).split(/\s+/).filter(w => w.length > 0);
    // Limpiar selección de plataforma
    activePlatformId = null;
    document.querySelectorAll('.platform-hero').forEach(c => c.classList.remove('selected'));

    const content = document.getElementById('main-content');
    content.innerHTML = `
        <div class="section-title">Búsqueda: "${query}"</div>
        <div class="info-banner" id="search-info">🔍 Buscando en múltiples fuentes e idiomas…</div>
        <p class="result-count" id="result-count"></p>
        <div class="grid" id="s-grid"></div>
        <p id="no-results" style="display:none;text-align:center;padding:40px;color:rgba(255,255,255,0.35)">
            No se encontraron títulos con todas las palabras buscadas.
        </p>`;

    content.scrollIntoView({ behavior: 'smooth', block: 'start' });

    const seen = new Set();
    const grid = document.getElementById('s-grid');
    let count = 0;

    function updateCount() {
        const el = document.getElementById('result-count');
        if (el) el.textContent = `${count} resultado${count !== 1 ? 's' : ''} encontrado${count !== 1 ? 's' : ''}`;
    }

    function tryAdd(item, mediaType, overridePlatform = null) {
        if (!item.poster_path || seen.has(item.id)) return;
        // Descartar no estrenados
        const dateRaw = item.release_date || item.first_air_date || '';
        if (!dateRaw || dateRaw > TODAY) return;
        const titleEs  = norm(item.title || item.name || '');
        const titleOri = norm(item.original_title || item.original_name || '');
        const matchEs  = keywords.every(kw => titleEs.includes(kw));
        const matchOri = keywords.every(kw => titleOri.includes(kw));
        if (!matchEs && !matchOri) return;
        seen.add(item.id);
        const display = mediaType === 'tv' ? { ...item, title: item.name || item.title } : item;
        const year = extractYear(item, mediaType);
        const card = createCard(display, year, overridePlatform ? logoHtml(overridePlatform) : '<span class="no-platform-tag">Cargando…</span>');
        grid.appendChild(card);
        enrichProviders(card, item.id, mediaType, overridePlatform);
        count++;
        updateCount();
    }

    // Estrategia 1: búsqueda general es-AR con región Argentina
    for (let page = 1; page <= 5; page++) {
        const data = await tmdb('/search/multi', { query, include_adult: false, page, region: 'AR', watch_region: 'AR' }, 'es-AR');
        if (!data.results?.length) break;
        data.results.filter(i => i.media_type !== 'person').forEach(i => tryAdd(i, i.media_type));
        if (page >= (data.total_pages || 1)) break;
    }
    // Estrategia 2: búsqueda en-US (títulos originales) también filtrada por AR
    for (let page = 1; page <= 3; page++) {
        const data = await tmdb('/search/multi', { query, include_adult: false, page, region: 'AR', watch_region: 'AR' }, 'en-US');
        if (!data.results?.length) break;
        data.results.filter(i => i.media_type !== 'person').forEach(i => tryAdd(i, i.media_type));
        if (page >= (data.total_pages || 1)) break;
    }
    // Estrategia 3: catálogos de cada plataforma
    await Promise.all(PLATFORMS.map(async platform => {
        const pids = platform.ids || [platform.id];
        const mAll = (await Promise.all(pids.map(pid => fetchPages('/discover/movie', { with_watch_providers: pid, watch_region: 'AR', sort_by: 'primary_release_date.desc' }, 10)))).flat();
        const tAll = (await Promise.all(pids.map(pid => fetchPages('/discover/tv',    { with_watch_providers: pid, watch_region: 'AR', sort_by: 'first_air_date.desc'       }, 10)))).flat();
        const [ms, ts] = [mAll, tAll];
        [...ms, ...ts].forEach(item => {
            const type = item.name !== undefined && item.title === undefined ? 'tv' : 
                         item.title !== undefined ? 'movie' : 
                         item.first_air_date !== undefined ? 'tv' : 'movie';
            tryAdd(item, type, platform);
        });
    }));

    document.getElementById('search-spinner').style.display = 'none';
    const info = document.getElementById('search-info');
    if (info) info.textContent = `🔍 Palabras buscadas: ${keywords.map(k => `"${k}"`).join(' + ')} — en español, inglés y catálogos de plataformas.`;
    if (count === 0) {
        const el = document.getElementById('no-results');
        if (el) el.style.display = 'block';
    }
}

async function showTopTen(btn) {
    document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    document.querySelectorAll('.platform-hero').forEach(c => c.classList.remove('selected'));

            </div>`;
        content.scrollIntoView({ behavior: 'smooth', block: 'start' });
        return;
    }

    const platform = PLATFORMS.find(p => p.id === activePlatformId);
    if (!platform) return;

    // Volver a marcar la plataforma activa
    const heroEl = document.getElementById(`ph-${activePlatformId}`);
    if (heroEl) heroEl.classList.add('selected');

    content.innerHTML = `<div class="big-spinner"><div class="big-spinner-ring"></div>Armando Top Ten de ${platform.name}…</div>`;
    content.scrollIntoView({ behavior: 'smooth', block: 'start' });

    const pids = platform.ids || [platform.id];

    // Traer con sort_by=vote_average.desc y vote_count alto para que el ranking sea confiable
    const [rawMovies, rawShows] = await Promise.all([
        Promise.all(pids.map(pid => fetchPages('/discover/movie', {
            with_watch_providers: pid,
            watch_region: 'AR',
            sort_by: 'vote_average.desc',
            'vote_count.gte': 200,
            'vote_average.gte': 5
        }, 3))).then(r => r.flat()),
        Promise.all(pids.map(pid => fetchPages('/discover/tv', {
            with_watch_providers: pid,
            watch_region: 'AR',
            sort_by: 'vote_average.desc',
            'vote_count.gte': 100,
            'vote_average.gte': 5
        }, 3))).then(r => r.flat())
    ]);

    // Deduplicar y tomar top 10 por vote_average desc
    const topMovies = dedupe(rawMovies)
        .filter(m => m.poster_path && m.vote_average > 0)
        .sort((a, b) => b.vote_average - a.vote_average)
        .slice(0, 10);

    const topShows = dedupe(rawShows)
        .filter(m => m.poster_path && m.vote_average > 0)
        .sort((a, b) => b.vote_average - a.vote_average)
        .slice(0, 10);

    content.innerHTML = `
        <div class="section-title">🏆 Top 10 Series · ${platform.name}</div>
        <div class="topten-podium" id="top-podium-tv"></div>
        <div class="topten-divider">— POSICIONES 4 AL 10 —</div>
        <div class="topten-grid" id="top-rest-tv"></div>

        <div class="section-title">🏆 Top 10 Películas · ${platform.name}</div>
        <div class="topten-podium" id="top-podium-movie"></div>
        <div class="topten-divider">— POSICIONES 4 AL 10 —</div>
        <div class="topten-grid" id="top-rest-movie"></div>
    `;

    renderTopTen(topShows,  'tv',    'top-podium-tv',    'top-rest-tv',    platform);
    renderTopTen(topMovies, 'movie', 'top-podium-movie', 'top-rest-movie', platform);
}

function renderTopTen(items, type, podiumId, restId, platform) {
    const podium = document.getElementById(podiumId);
    const rest   = document.getElementById(restId);
    if (!podium || !rest) return;

    items.forEach((item, idx) => {
        const rank = idx + 1;
        const display = type === 'tv' ? { ...item, title: item.name } : item;
        const year = extractYear(item, type);
        const score = item.vote_average ? item.vote_average.toFixed(1) : '';
        const logosHtml = logoHtml(platform);

        const card = createCard(display, year, logosHtml);

        // Agregar badge de ranking
        const badgeClass = rank === 1 ? 'rank-1' : rank === 2 ? 'rank-2' : rank === 3 ? 'rank-3' : 'rank-other';
        const badge = document.createElement('div');
        badge.className = `rank-badge ${badgeClass}`;
        badge.textContent = rank <= 3 ? ['🥇','🥈','🥉'][rank-1] : `#${rank}`;
        card.appendChild(badge);

        // Agregar score visible en la info
        const infoEl = card.querySelector('.item-info');
        if (infoEl && score) {
            const scoreEl = document.createElement('div');
            scoreEl.style.cssText = 'font-size:0.78rem;color:#f5c518;font-weight:700;margin-bottom:4px;';
            scoreEl.textContent = `★ ${score} / 10`;
            infoEl.insertBefore(scoreEl, infoEl.querySelector('.provider-row'));
        }

        if (rank <= 3) {
            podium.appendChild(card);
        } else {
            rest.appendChild(card);
        }

        enrichProviders(card, item.id, type, platform);
    });
}

// ── CREAR TARJETA ──────────────────────────────────
function createCard(m, year, logosHtml = '') {
    const title = m.title || m.name || '';
    const safeTitle = title.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    const card = document.createElement('div');
    card.className = 'item-card';
    const isSaved = isInBoveda(m.id);
    card.innerHTML = `
        <button class="fav-btn ${isSaved ? 'saved' : ''}" title="${isSaved ? 'Quitar de Bóveda' : 'Guardar en Bóveda'}" onclick="event.stopPropagation(); toggleBoveda(this, card._itemData)">${isSaved ? '🔖' : '🔖'}</button>
        <button class="ia-btn" title="Preguntar a la IA" onclick="event.stopPropagation(); openChat('${safeTitle}')">✦</button>
        <img class="poster" src="https://image.tmdb.org/t/p/w500${m.poster_path}" alt="${title.replace(/"/g,'&quot;')}" loading="lazy">
        <div class="item-info">
            <p class="item-title">${title}</p>
            ${year ? `<p class="item-year">${year}</p>` : ''}
            <div class="provider-row">${logosHtml}</div>
        </div>`;
    // Guardar datos para el detail overlay
    card._itemData = m;
    card._year = year;
    // Asignar _itemData al fav-btn después de que el innerHTML esté seteado
    const favBtn = card.querySelector('.fav-btn');
    if (favBtn) favBtn.onclick = (e) => { e.stopPropagation(); toggleBoveda(favBtn, card._itemData); };
    card.addEventListener('click', () => openDetail(card._itemData, card._year, card.querySelector('.provider-row').innerHTML));
    return card;
}

// ── DETAIL OVERLAY ─────────────────────────────────
let detailCurrentTitle = '';

async function openDetail(m, year, providersHtml) {
    const overlay = document.getElementById('detail-overlay');
    const title = m.title || m.name || '';
    detailCurrentTitle = title;
    detailCurrentItem = m;
    // Actualizar botón guardar
    updateDetailSaveBtn(m.id);

    // Poster
    document.getElementById('detail-poster').src = m.poster_path
        ? `https://image.tmdb.org/t/p/w500${m.poster_path}` : '';
    document.getElementById('detail-poster').alt = title;

    // Título
    document.getElementById('detail-title').textContent = title;

    // Meta básica mientras carga el detalle
    const type = m.first_air_date !== undefined ? 'tv' : 'movie';
    const dateRaw = type === 'tv' ? m.first_air_date : m.release_date;
    const yearStr = dateRaw ? dateRaw.slice(0,4) : (year || '');
    document.getElementById('detail-meta').innerHTML =
        `${yearStr ? `<span class="d-badge d-year">${yearStr}</span>` : ''}
         <span class="d-badge d-type">${type === 'tv' ? 'Serie' : 'Película'}</span>`;

    // Overview y rating del objeto base
    const overview = m.overview || '';
    document.getElementById('detail-overview').textContent = overview || 'Sin descripción disponible.';
    renderRating(m.vote_average || 0, m.vote_count || 0);

    // Providers (reutilizar lo ya cargado en la tarjeta)
    const provWrap = document.getElementById('detail-providers-wrap');
    if (providersHtml && !providersHtml.includes('Cargando') && !providersHtml.includes('Sin datos') && providersHtml.trim()) {
        // Convertir mini-logo a detail-mini-logo
        provWrap.innerHTML = `<span class="d-provider-label">Disponible en:</span> ` +
            providersHtml.replace(/class="mini-logo"/g, 'class="detail-mini-logo"');
    } else {
        provWrap.innerHTML = '';
    }

    // Abrir overlay
    overlay.classList.add('open');
    document.body.style.overflow = 'hidden';

    // Fetch detalle completo (géneros, rating actualizado)
    try {
        const detail = await fetch(`https://api.themoviedb.org/3/${type}/${m.id}?api_key=${TMDB_KEY}&language=es-AR`).then(r => r.json());
        // Géneros
        const genres = (detail.genres || []).slice(0, 2).map(g => `<span class="d-badge d-genre">${g.name}</span>`).join('');
        document.getElementById('detail-meta').innerHTML =
            `${yearStr ? `<span class="d-badge d-year">${yearStr}</span>` : ''}
             <span class="d-badge d-type">${type === 'tv' ? 'Serie' : 'Película'}</span>
             ${genres}`;
        // Overview actualizado
        const ov = detail.overview || overview || 'Sin descripción disponible.';
        document.getElementById('detail-overview').textContent = ov;
        // Rating actualizado
        renderRating(detail.vote_average || m.vote_average || 0, detail.vote_count || m.vote_count || 0);
    } catch {}
}

function renderRating(avg, votes) {
    const score = Math.round(avg * 10) / 10;
    const outOf5 = avg / 2;
    let stars = '';
    for (let i = 1; i <= 5; i++) {
        if (outOf5 >= i)            stars += '<span class="star full">★</span>';
        else if (outOf5 >= i - 0.5) stars += '<span class="star half">★</span>';
        else                        stars += '<span class="star empty">★</span>';
    }
    const voteStr = votes > 1000 ? `${(votes/1000).toFixed(1)}k votos` : votes ? `${votes} votos` : '';
    document.getElementById('detail-rating').innerHTML = score > 0 ? `
        <div class="stars-wrap">${stars}</div>
        <span class="rating-num">${score}</span>
        <span class="rating-max">/ 10</span>
        ${voteStr ? `<span class="rating-votes">(${voteStr})</span>` : ''}
    ` : '';
}

function closeDetail() {
    document.getElementById('detail-overlay').classList.remove('open');
    document.body.style.overflow = '';
}

function openChatFromDetail() {
    closeDetail();
    openChat(detailCurrentTitle);
}

// Cerrar con Escape
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDetail(); });

// ── CHAT IA ────────────────────────────────────────
function openChat(title) {
    currentItem = title;
    document.getElementById('chat-modal').style.display = 'flex';
    document.getElementById('chat-title').innerText = title;
    document.getElementById('chat-body').innerHTML = `
        <div class="msg bot">Hola! ¿Qué querés saber sobre <b>${title}</b>?</div>`;
    document.getElementById('user-msg').focus();
}

async function sendMessage() {
    const input = document.getElementById('user-msg');
    const text = input.value.trim();
    if (!text) return;
    const body = document.getElementById('chat-body');
    body.innerHTML += `<div class="msg user">${text}</div>`;
    input.value = '';
    body.scrollTop = body.scrollHeight;
    const tid = 'msg-' + Date.now();
    body.innerHTML += `<div class="msg bot" id="${tid}" style="opacity:0.5">Pensando…</div>`;
    try {
        const resp = await fetch(
            `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_KEY}`,
            {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: `Sos un experto en cine y series. El usuario pregunta sobre "${currentItem}": ${text}. Respondé en español rioplatense, breve y claro, sin markdown.` }] }]
                })
            }
        );
        const data = await resp.json();
        const reply = data?.candidates?.[0]?.content?.parts?.[0]?.text || 'No pude obtener respuesta.';
        const el = document.getElementById(tid);
        if (el) { el.textContent = reply; el.style.opacity = '1'; }
    } catch {
        const el = document.getElementById(tid);
        if (el) { el.textContent = 'Error de conexión.'; el.style.opacity = '1'; }
    }
    body.scrollTop = body.scrollHeight;
}

function closeModal() { document.getElementById('chat-modal').style.display = 'none'; }

function goHome() {
    document.getElementById('search-input').value = '';
    document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.platform-hero').forEach(c => c.classList.remove('selected'));
    activePlatformId = null;
    document.getElementById('main-content').innerHTML = '';
}

// ── BÓVEDA ─────────────────────────────────────────
function getBoveda() { return JSON.parse(localStorage.getItem('streamvault_favs')) || []; }
function saveBoveda(arr) { localStorage.setItem('streamvault_favs', JSON.stringify(arr)); }
function isInBoveda(id) { return getBoveda().some(i => i.id === id); }

function toggleBoveda(btn, item) {
    if (!item) return;
    let boveda = getBoveda();
    const idx = boveda.findIndex(i => i.id === item.id);
    if (idx >= 0) {
        // Quitar
        boveda.splice(idx, 1);
        saveBoveda(boveda);
        if (btn) { btn.classList.remove('saved'); btn.title = 'Guardar en Bóveda'; }
        showToast('Quitado de la Bóveda');
    } else {
        // Guardar
        boveda.unshift({ ...item, savedAt: Date.now() });
        saveBoveda(boveda);
        if (btn) { btn.classList.add('saved'); btn.title = 'Quitar de Bóveda'; }
        showToast('¡Guardado en la Bóveda! 🔖');
    }
    // Actualizar botón del overlay si está abierto
    updateDetailSaveBtn(item.id);
    // Actualizar contador del header
    updateBovedaCount();
}

let detailCurrentItem = null;

function toggleBovedaFromDetail() {
    if (!detailCurrentItem) return;
    const btn = document.getElementById('detail-save-btn');
    toggleBoveda(null, detailCurrentItem);
    updateDetailSaveBtn(detailCurrentItem.id);
    // Actualizar también el fav-btn de la tarjeta si está visible
    document.querySelectorAll('.fav-btn').forEach(fb => {
        const card = fb.closest('.item-card');
        if (card && card._itemData && card._itemData.id === detailCurrentItem.id) {
            const saved = isInBoveda(detailCurrentItem.id);
            fb.classList.toggle('saved', saved);
        }
    });
}

function updateDetailSaveBtn(id) {
    const btn = document.getElementById('detail-save-btn');
    if (!btn) return;
    const saved = isInBoveda(id);
    btn.classList.toggle('saved', saved);
    btn.innerHTML = saved ? '🔖 En tu Bóveda' : '🔖 Guardar en Bóveda';
}

function updateBovedaCount() {
    const count = getBoveda().length;
    const el = document.getElementById('boveda-link');
    if (el) el.textContent = count > 0 ? `📁 Bóveda (${count})` : '📁 Bóveda';
}

function showToast(msg) {
    let toast = document.getElementById('sv-toast');
    if (!toast) {
        toast = document.createElement('div');
        toast.id = 'sv-toast';
        toast.style.cssText = 'position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);background:#1e2d1e;border:1px solid var(--neon-green);color:var(--neon-green);padding:10px 22px;border-radius:30px;font-size:0.88rem;font-weight:600;z-index:9999;opacity:0;transition:all 0.3s;pointer-events:none;white-space:nowrap;';
        document.body.appendChild(toast);
    }
    toast.textContent = msg;
    toast.style.opacity = '1';
    toast.style.transform = 'translateX(-50%) translateY(0)';
    clearTimeout(toast._t);
    toast._t = setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(-50%) translateY(20px)';
    }, 2200);
}

function verBoveda() {
    const boveda = getBoveda();
    activePlatformId = null;
    document.querySelectorAll('.platform-hero').forEach(c => c.classList.remove('selected'));
    document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('active'));
    const content = document.getElementById('main-content');
    content.scrollIntoView({ behavior: 'smooth', block: 'start' });
    if (!boveda.length) {
        content.innerHTML = `<div class="section-title">📁 Tu Bóveda</div><p style="text-align:center;padding:50px;color:rgba(255,255,255,0.35)">Tu bóveda está vacía.<br><span style="font-size:0.8rem">Guardá títulos tocando el 🔖 en cada tarjeta.</span></p>`;
        return;
    }
    content.innerHTML = `<div class="section-title">📁 Tu Bóveda <span class="section-subtitle">${boveda.length} títulos guardados</span></div><div class="grid" id="b-grid"></div>`;
    boveda.forEach(item => {
        const year = item.release_date ? item.release_date.slice(0,4) : item.first_air_date ? item.first_air_date.slice(0,4) : '';
        const card = createCard(item, year, '');
        // Botón para quitar de la bóveda
        const removeBtn = document.createElement('button');
        removeBtn.className = 'boveda-remove-btn';
        removeBtn.title = 'Quitar de Bóveda';
        removeBtn.textContent = '✕';
        removeBtn.onclick = (e) => {
            e.stopPropagation();
            let b = getBoveda();
            b = b.filter(i => i.id !== item.id);
            saveBoveda(b);
            card.remove();
            updateBovedaCount();
            showToast('Quitado de la Bóveda');
            // Si quedó vacía, actualizar vista
            const grid = document.getElementById('b-grid');
            if (grid && !grid.children.length) verBoveda();
        };
        card.appendChild(removeBtn);
        document.getElementById('b-grid').appendChild(card);
    });
}

// ── AUTO-DESCUBRIMIENTO DE IDs DE MAX EN AR ────────
// Consulta el endpoint de providers de AR y actualiza los IDs de Max dinámicamente
async function discoverMaxIds() {
    try {
        const [movResp, tvResp] = await Promise.all([
            fetch(`${TMDB}/watch/providers/movie?api_key=${TMDB_KEY}&watch_region=AR&language=es-AR`),
            fetch(`${TMDB}/watch/providers/tv?api_key=${TMDB_KEY}&watch_region=AR&language=es-AR`)
        ]);
        const movData = await movResp.json();
        const tvData  = await tvResp.json();

        const allProviders = [
            ...(movData.results || []),
            ...(tvData.results  || [])
        ];

        // Buscar cualquier proveedor con nombre que contenga "max" o "hbo"
        const maxKeywords = ['max', 'hbo'];
        const maxIds = [...new Set(
            allProviders
                .filter(p => maxKeywords.some(kw => p.provider_name.toLowerCase().includes(kw)))
                .map(p => p.provider_id)
        )];

        if (maxIds.length > 0) {
            const maxPlatform = PLATFORMS.find(p => p.name === 'Max');
            if (maxPlatform) {
                // Combinar con los IDs base para no perder ninguno
                const combined = [...new Set([...maxPlatform.ids, ...maxIds])];
                maxPlatform.ids = combined;
                console.log('[StreamVault] Max IDs en AR:', combined, '— Providers encontrados:', 
                    allProviders.filter(p => maxKeywords.some(kw => p.provider_name.toLowerCase().includes(kw))).map(p => `${p.provider_name}(${p.provider_id})`));
            }
        }
    } catch(e) {
        console.warn('[StreamVault] No se pudo descubrir IDs de Max:', e);
    }
}

// ── INICIO ─────────────────────────────────────────
discoverMaxIds();   // Ejecutar en background para tener IDs actualizados
renderPlatformCards();
updateBovedaCount();
</script>
