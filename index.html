<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamVault 2026 - Cine & Series</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #080c12; --surface: #0f1520; --border: rgba(255,255,255,0.07); --text: #f0f4ff; --accent: #4f8ef7; }
        body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); margin: 0; }
        header { position: sticky; top: 0; background: rgba(8,12,18,0.9); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); padding: 15px 30px; display: flex; align-items: center; justify-content: space-between; z-index: 100; }
        .logo { font-family: 'Bebas Neue', sans-serif; font-size: 1.8rem; letter-spacing: 2px; }
        .logo span { color: var(--accent); }
        .search-wrap { flex: 1; max-width: 400px; margin: 0 20px; }
        input { width: 100%; padding: 10px 15px; border-radius: 10px; border: 1px solid var(--border); background: #161e2e; color: white; outline: none; }
        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .platform-card { background: var(--surface); padding: 30px; border-radius: 15px; border-bottom: 5px solid var(--p-color); cursor: pointer; text-align: center; transition: 0.3s; }
        .platform-card:hover { transform: translateY(-5px); filter: brightness(1.2); }
        .platform-card img { max-width: 120px; height: 50px; object-fit: contain; filter: brightness(0) invert(1); }
        .movie-card { background: var(--surface); border-radius: 12px; overflow: hidden; position: relative; animation: fadeIn 0.5s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .poster { width: 100%; aspect-ratio: 2/3; object-fit: cover; }
        .movie-info { padding: 15px; }
        .type-badge { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); color: white; padding: 3px 8px; border-radius: 5px; font-size: 0.65rem; font-weight: bold; text-transform: uppercase; border: 1px solid var(--border); }
        .btn-back { background: #333; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; display: none; }
    </style>
</head>
<body>

<header>
    <div class="logo" onclick="location.reload()" style="cursor:pointer">Stream<span>Vault</span></div>
    <div class="search-wrap">
        <input type="text" id="search-input" placeholder="Buscar películas o series..." onkeyup="handleSearch(event)">
    </div>
    <button class="btn-back" id="btn-back" onclick="location.reload()">← Volver</button>
</header>

<main class="container" id="main-container">
    </main>

<script>
    const API_KEY = '5fe1eec4e7d975c66b9fefa6bd3299ce'; 
    const LANG = 'es-AR';

    const PLATFORMS = [
        { name: 'Netflix', id: 8, color: '#E50914', logo: 'https://upload.wikimedia.org/wikipedia/commons/0/08/Netflix_2015_logo.svg' },
        { name: 'Disney+', id: 337, color: '#006E99', logo: 'https://upload.wikimedia.org/wikipedia/commons/3/3e/Disney%2B_logo.svg' },
        { name: 'Prime Video', id: 119, color: '#00A8E1', logo: 'https://upload.wikimedia.org/wikipedia/commons/1/11/Amazon_Prime_Video_logo.svg' },
        { name: 'Max', id: 384, color: '#8B5CF6', logo: 'https://upload.wikimedia.org/wikipedia/commons/c/ce/Max_logo.svg' }
    ];

    function showPlatforms() {
        const container = document.getElementById('main-container');
        container.innerHTML = '';
        PLATFORMS.forEach(p => {
            const card = document.createElement('div');
            card.className = 'platform-card';
            card.style.setProperty('--p-color', p.color);
            card.onclick = () => loadCatalog(p);
            card.innerHTML = `<img src="${p.logo}" alt="${p.name}"><p style="margin-top:10px; font-weight:bold; font-size:0.8rem">${p.name}</p>`;
            container.appendChild(card);
        });
    }

    async function loadCatalog(p) {
        document.getElementById('btn-back').style.display = 'block';
        const container = document.getElementById('main-container');
        container.innerHTML = `<p style="grid-column: 1/-1; text-align:center">Cargando cine y series de ${p.name}...</p>`;

        try {
            // Consultamos Películas Y Series por separado y las unimos
            const [moviesResp, tvResp] = await Promise.all([
                fetch(`https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&language=${LANG}&sort_by=popularity.desc&with_watch_providers=${p.id}&watch_region=AR`),
                fetch(`https://api.themoviedb.org/3/discover/tv?api_key=${API_KEY}&language=${LANG}&sort_by=popularity.desc&with_watch_providers=${p.id}&watch_region=AR`)
            ]);

            const moviesData = await moviesResp.json();
            const tvData = await tvResp.json();

            // Etiquetamos cada uno para saber qué es
            const movies = moviesData.results.map(m => ({ ...m, type: 'Película' }));
            const series = tvData.results.map(s => ({ ...s, type: 'Serie', title: s.name, release_date: s.first_air_date }));

            // Mezclamos y ordenamos por popularidad
            const combined = [...movies, ...series].sort((a, b) => b.popularity - a.popularity);
            renderItems(combined);
        } catch (e) {
            container.innerHTML = '<p>Error al cargar el catálogo.</p>';
        }
    }

    async function handleSearch(event) {
        const q = event.target.value.trim();
        if (q.length < 3) return;
        document.getElementById('btn-back').style.display = 'block';
        
        // Usamos search/multi para buscar todo a la vez
        const url = `https://api.themoviedb.org/3/search/multi?api_key=${API_KEY}&language=${LANG}&query=${q}`;
        const resp = await fetch(url);
        const data = await resp.json();
        
        const results = data.results.map(item => {
            if (item.media_type === 'tv') {
                return { ...item, type: 'Serie', title: item.name, release_date: item.first_air_date };
            }
            return { ...item, type: 'Película' };
        }).filter(item => item.media_type !== 'person'); // Filtramos nombres de actores

        renderItems(results);
    }

    function renderItems(items) {
        const container = document.getElementById('main-container');
        container.innerHTML = '';
        if (!items || items.length === 0) {
            container.innerHTML = '<p style="grid-column: 1/-1; text-align:center">No se encontraron resultados.</p>';
            return;
        }
        items.forEach(m => {
            if (!m.poster_path) return;
            const card = document.createElement('div');
            card.className = 'movie-card';
            card.innerHTML = `
                <div class="type-badge">${m.type}</div>
                <img class="poster" src="https://image.tmdb.org/t/p/w500${m.poster_path}">
                <div class="movie-info">
                    <h3 style="font-size:0.9rem; margin:0; height: 2.4em; overflow: hidden;">${m.title}</h3>
                    <p style="font-size:0.75rem; color:#888; margin:5px 0">★ ${m.vote_average ? m.vote_average.toFixed(1) : 'N/A'}</p>
                </div>`;
            container.appendChild(card);
        });
    }

    showPlatforms();
</script>
</body>
</html>
