<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamVault 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        /* Mantenemos tu excelente CSS intacto */
        :root {
            --bg: #080c12;
            --surface: #0f1520;
            --surface2: #161e2e;
            --border: rgba(255,255,255,0.07);
            --text: #f0f4ff;
            --muted: #6b7a99;
            --accent: #4f8ef7;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(79,142,247,0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(79,142,247,0.025) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
        }

        header {
            position: sticky; top: 0; z-index: 100;
            background: rgba(8,12,18,0.9);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 14px 32px;
            display: flex; align-items: center; gap: 24px;
        }

        .logo {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.7rem; letter-spacing: 3px; white-space: nowrap; flex-shrink: 0;
        }
        .logo span { color: var(--accent); }

        .search-wrap { flex: 1; max-width: 500px; position: relative; }
        .search-wrap .ico {
            position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
            color: var(--muted); pointer-events: none; width: 17px; height: 17px;
        }

        #search-input {
            width: 100%; padding: 11px 16px 11px 44px;
            background: var(--surface2); border: 1px solid var(--border); border-radius: 12px;
            color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 0.95rem;
            outline: none; transition: border-color 0.2s, box-shadow 0.2s;
        }
        #search-input::placeholder { color: var(--muted); }
        #search-input:focus { border-color: rgba(79,142,247,0.5); box-shadow: 0 0 0 3px rgba(79,142,247,0.1); }

        #back-btn {
            display: none; align-items: center; gap: 6px;
            padding: 9px 18px; background: var(--surface2); border: 1px solid var(--border);
            border-radius: 10px; color: var(--text); font-family: 'DM Sans', sans-serif;
            font-size: 0.88rem; font-weight: 500; cursor: pointer; transition: all 0.2s; white-space: nowrap; flex-shrink: 0;
        }
        #back-btn:hover { background: var(--surface); border-color: rgba(255,255,255,0.15); }

        main { position: relative; z-index: 1; padding: 44px 32px; max-width: 1280px; margin: 0 auto; }

        .section-title { font-family: 'Bebas Neue', sans-serif; font-size: 2.2rem; letter-spacing: 2px; margin-bottom: 6px; }
        .section-sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 32px; }

        #platform-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 18px; }

        .platform-card {
            background: var(--surface); border: 1px solid var(--border); border-radius: 20px;
            padding: 32px 24px; cursor: pointer; transition: transform 0.25s, box-shadow 0.25s, border-color 0.25s;
            display: flex; flex-direction: column; align-items: center; gap: 18px;
            position: relative; overflow: hidden;
        }
        .platform-card::after {
            content: ''; position: absolute; bottom: 0; left: 0; right: 0;
            height: 4px; background: var(--p-color, #4f8ef7); transition: height 0.25s;
        }
        .platform-card:hover { transform: translateY(-6px); box-shadow: 0 20px 40px rgba(0,0,0,0.4); border-color: rgba(255,255,255,0.12); }
        .platform-card:hover::after { height: 6px; }

        .p-glow {
            position: absolute; inset: 0;
            background: radial-gradient(circle at 50% 110%, var(--p-color) 0%, transparent 65%);
            opacity: 0; transition: opacity 0.3s;
        }
        .platform-card:hover .p-glow { opacity: 0.08; }

        .p-logo { width: 130px; height: 54px; display: flex; align-items: center; justify-content: center; }
        .p-logo img { max-width: 100%; max-height: 100%; object-fit: contain; filter: brightness(0) invert(1); }
        .p-name { font-size: 0.78rem; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }

        #movies-view { display: none; }

        .platform-hero {
            display: flex; align-items: center; gap: 18px;
            margin-bottom: 36px; padding: 24px 28px;
            background: var(--surface); border: 1px solid var(--border); border-radius: 18px;
            border-left: 5px solid var(--p-color, #4f8ef7);
        }
        .platform-hero img { height: 36px; object-fit: contain; filter: brightness(0) invert(1); }
        .platform-hero h2 { font-family: 'Bebas Neue', sans-serif; font-size: 1.7rem; letter-spacing: 2px; }
        .platform-hero p { color: var(--muted); font-size: 0.88rem; margin-top: 3px; }

        #movies-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(175px, 1fr)); gap: 18px; }

        .movie-card {
            background: var(--surface); border-radius: 14px; overflow: hidden;
            border: 1px solid var(--border); cursor: pointer;
            transition: transform 0.25s, box-shadow 0.25s;
            animation: fadeUp 0.4s ease both;
        }
        .movie-card:hover { transform: translateY(-5px) scale(1.02); box-shadow: 0 16px 32px rgba(0,0,0,0.5); }

        @keyframes fadeUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }

        .movie-poster { width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block; background: var(--surface2); }
        .movie-info { padding: 11px 13px 14px; }
        .movie-title { font-size: 0.85rem; font-weight: 600; line-height: 1.3; margin-bottom: 5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .movie-meta { font-size: 0.76rem; color: var(--muted); display: flex; align-items: center; gap: 8px; }
        .movie-rating { color: #f5c518; font-weight: 600; }

        #search-view { display: none; }

        .result-card {
            display: flex; background: var(--surface); border: 1px solid var(--border);
            border-radius: 16px; overflow: hidden; margin-bottom: 14px;
            transition: border-color 0.2s, transform 0.2s; animation: fadeUp 0.3s ease both;
        }
        .result-card:hover { border-color: rgba(255,255,255,0.14); transform: translateX(3px); }

        .result-poster { width: 85px; flex-shrink: 0; object-fit: cover; display: block; background: var(--surface2); }
        .result-body { padding: 16px 20px; flex: 1; display: flex; flex-direction: column; gap: 7px; justify-content: center; }
        .result-title { font-size: 1.05rem; font-weight: 600; }
        .result-original { font-size: 0.78rem; color: var(--muted); }
        .result-platforms { display: flex; flex-wrap: wrap; gap: 5px; }

        .platform-pill {
            font-size: 0.71rem; font-weight: 600; letter-spacing: 0.4px;
            padding: 3px 10px; border-radius: 20px; border: 1px solid;
        }
        .pill-none { color: var(--muted); border-color: var(--border); background: transparent; }

        .result-overview { font-size: 0.83rem; color: var(--muted); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        .result-meta { font-size: 0.79rem; color: var(--muted); display: flex; align-items: center; gap: 10px; }

        .loader { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 70px 0; color: var(--muted); }
        .spinner { width: 38px; height: 38px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .empty { text-align: center; padding: 70px 0; color: var(--muted); }
        .empty h3 { font-size: 1.1rem; font-weight: 500; margin-bottom: 6px; color: var(--text); }

        #error-box {
            display: none;
            position: fixed; bottom: 16px; right: 16px;
            background: #1a0a0a; border: 1px solid #c0392b;
            border-radius: 10px; padding: 14px 40px 14px 18px; max-width: 420px;
            font-size: 0.8rem; font-family: monospace; color: #e74c3c; z-index: 999;
        }
    </style>
</head>
<body>

<header>
    <div class="logo" style="cursor:pointer" onclick="showHome()">Stream<span>Vault</span></div>
    <div class="search-wrap">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <input type="text" id="search-input" placeholder="Buscar en todas las plataformas..." autocomplete="off">
    </div>
    <button id="back-btn" onclick="showHome()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
        Plataformas
    </button>
</header>

<main>
    <div id="home-view">
        <div class="section-title">Plataformas</div>
        <div class="section-sub">Elegí una plataforma para explorar su catálogo</div>
        <div id="platform-grid"></div>
    </div>

    <div id="movies-view">
        <div class="platform-hero" id="platform-hero">
            <img id="hero-logo" src="" alt="">
            <div>
                <h2 id="hero-name"></h2>
                <p id="hero-sub">Cargando...</p>
            </div>
        </div>
        <div id="movies-grid"></div>
    </div>

    <div id="search-view">
        <div style="margin-bottom:26px">
            <div class="section-title" id="search-title">Resultados</div>
            <div class="section-sub" id="search-sub"></div>
        </div>
        <div id="search-results"></div>
    </div>
</main>

<div id="error-box">
    <button id="err-close" onclick="document.getElementById('error-box').style.display='none'">✕</button>
    <strong>⚠ Error de API</strong>
    <span id="err-msg"></span>
</div>

<script>
    // ── CONFIG ACTUALIZADA ─────────────────────────────────────
    const API_KEY = '5fe1eec4e7d975c66b9fefa6bd3299ce';
    const BASE    = 'https://api.themoviedb.org/3';
    const IMG     = 'https://image.tmdb.org/t/p/w342';
    const LANG    = 'es-AR';

    // Usamos esta constante directamente para evitar bloqueos CORS de archivos locales
    const PLATFORMS = [
        { id: 'netflix', name: 'Netflix',     providerId: 8,   color: '#E50914', logoUrl: 'https://upload.wikimedia.org/wikipedia/commons/0/08/Netflix_2015_logo.svg' },
        { id: 'disney',  name: 'Disney+',     providerId: 337, color: '#006E99', logoUrl: 'https://upload.wikimedia.org/wikipedia/commons/3/3e/Disney%2B_logo.svg' },
        { id: 'prime',   name: 'Prime Video', providerId: 119, color: '#00A8E1', logoUrl: 'https://upload.wikimedia.org/wikipedia/commons/1/11/Amazon_Prime_Video_logo.svg' },
        { id: 'max',     name: 'Max',          providerId: 384, color: '#8B5CF6', logoUrl: 'https://upload.wikimedia.org/wikipedia/commons/c/ce/Max_logo.svg' },
    ];

    let searchTimer = null;

    // ── FUNCIONES ──────────────────────────────────────────────
    async function api(path, params = {}) {
        const url = new URL(BASE + path);
        url.searchParams.set('api_key', API_KEY);
        url.searchParams.set('language', LANG);
        for (const [k, v] of Object.entries(params)) url.searchParams.set(k, v);
        
        try {
            const r = await fetch(url.toString());
            if (!r.ok) throw new Error(`Error TMDB: ${r.status}`);
            return await r.json();
        } catch (e) {
            console.error(e);
            throw e;
        }
    }

    function showView(v) {
        document.getElementById('home-view').style.display   = v === 'home'   ? '' : 'none';
        document.getElementById('movies-view').style.display = v === 'movies' ? '' : 'none';
        document.getElementById('search-view').style.display = v === 'search' ? '' : 'none';
        document.getElementById('back-btn').style.display    = v !== 'home'   ? 'flex' : 'none';
    }

    function showHome() {
        document.getElementById('search-input').value = '';
        showView('home');
    }

    function renderPlatforms() {
        const grid = document.getElementById('platform-grid');
        grid.innerHTML = '';
        PLATFORMS.forEach(p => {
            const card = document.createElement('div');
            card.className = 'platform-card';
            card.style.setProperty('--p-color', p.color);
            card.onclick = () => loadMovies(p);
            card.innerHTML = `
                <div class="p-glow"></div>
                <div class="p-logo"><img src="${p.logoUrl}" alt="${p.name}"></div>
                <div class="p-name">${p.name}</div>`;
            grid.appendChild(card);
        });
    }

    async function loadMovies(p) {
        showView('movies');
        const hero = document.getElementById('platform-hero');
        hero.style.borderLeftColor = p.color;
        document.getElementById('hero-logo').src = p.logoUrl;
        document.getElementById('hero-name').textContent = p.name;
        document.getElementById('hero-sub').textContent = 'Cargando catálogo...';

        const grid = document.getElementById('movies-grid');
        grid.innerHTML = `<div class="loader" style="grid-column:1/-1"><div class="spinner"></div><span>Buscando en ${p.name}...</span></div>`;

        try {
            // Usamos Discover con una región amplia para asegurar resultados
            const data = await api('/discover/movie', {
                sort_by: 'popularity.desc',
                with_watch_providers: p.providerId,
                watch_region: 'AR' // Podés probar con 'US' si AR devuelve poco
            });

            const movies = data.results.filter(m => m.poster_path);
            grid.innerHTML = '';

            if (movies.length === 0) {
                grid.innerHTML = `<div class="empty" style="grid-column:1/-1"><h3>No hay títulos disponibles</h3><p>Intenta con otra plataforma.</p></div>`;
                return;
            }

            document.getElementById('hero-sub').textContent = `${movies.length} títulos populares encontrados`;

            movies.forEach((movie, i) => {
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.style.animationDelay = (i * 0.05) + 's';
                const year = movie.release_date ? movie.release_date.split('-') : 'N/A';
                card.innerHTML = `
                    <img class="movie-poster" src="${IMG}${movie.poster_path}" alt="${movie.title}">
                    <div class="movie-info">
                        <div class="movie-title">${movie.title}</div>
                        <div class="movie-meta">
                            <span>${year}</span>
                            <span class="movie-rating">★ ${movie.vote_average.toFixed(1)}</span>
                        </div>
                    </div>`;
                grid.appendChild(card);
            });
        } catch (e) {
            grid.innerHTML = `<p style="grid-column:1/-1">Error al cargar datos.</p>`;
        }
    }

    // ── BUSQUEDA ───────────────────────────────────────────────
    document.getElementById('search-input').addEventListener('input', (e) => {
        const q = e.target.value.trim();
        clearTimeout(searchTimer);
        if (!q) { showHome(); return; }
        if (q.length < 3) return;
        searchTimer = setTimeout(() => runSearch(q), 500);
    });

    async function runSearch(query) {
        showView('search');
        document.getElementById('search-title').textContent = `"${query}"`;
        const container = document.getElementById('search-results');
        container.innerHTML = `<div class="loader"><div class="spinner"></div><span>Buscando...</span></div>`;

        try {
            const data = await api('/search/movie', { query: query });
            const movies = data.results.filter(m => m.poster_path).slice(0, 10);
            container.innerHTML = '';

            if (movies.length === 0) {
                container.innerHTML = `<div class="empty"><h3>No se encontró nada</h3></div>`;
                return;
            }

            for (const movie of movies) {
                // Para cada película, verificamos plataformas
                const providers = await api(`/movie/${movie.id}/watch/providers`);
                const arProviders = providers.results?.AR?.flatrate || [];
                
                const foundPlatforms = PLATFORMS.filter(p => 
                    arProviders.some(ap => ap.provider_id === p.providerId)
                );

                const pills = foundPlatforms.length > 0 
                    ? foundPlatforms.map(p => `<span class="platform-pill" style="color:${p.color};border-color:${p.color}40;background:${p.color}15;">${p.name}</span>`).join('')
                    : `<span class="platform-pill pill-none">No disponible en streaming (AR)</span>`;

                const card = document.createElement('div');
                card.className = 'result-card';
                card.innerHTML = `
                    <img class="result-poster" src="${IMG}${movie.poster_path}">
                    <div class="result-body">
                        <div class="result-title">${movie.title}</div>
                        <div class="result-meta">
                            <span>${movie.release_date?.split('-') || ''}</span>
                            <span class="movie-rating">★ ${movie.vote_average.toFixed(1)}</span>
                        </div>
                        <div class="result-platforms">${pills}</div>
                        <div class="result-overview">${movie.overview || 'Sin descripción.'}</div>
                    </div>`;
                container.appendChild(card);
            }
        } catch (e) {
            container.innerHTML = `<p>Error en la búsqueda.</p>`;
        }
    }

    // Iniciar
    renderPlatforms();
</script>
</body>
</html>
