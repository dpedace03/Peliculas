<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamVault 2026 - Cine & Series</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #080c12; --surface: #0f1520; --border: rgba(255,255,255,0.07); --text: #f0f4ff; --accent: #4f8ef7; }
        body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); margin: 0; }
        header { position: sticky; top: 0; background: rgba(8,12,18,0.9); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); padding: 15px 30px; display: flex; align-items: center; justify-content: space-between; z-index: 100; }
        .logo { font-family: 'Bebas Neue', sans-serif; font-size: 1.8rem; letter-spacing: 2px; }
        .logo span { color: var(--accent); }
        .search-wrap { flex: 1; max-width: 400px; margin: 0 20px; }
        input { width: 100%; padding: 10px 15px; border-radius: 10px; border: 1px solid var(--border); background: #161e2e; color: white; outline: none; }
        
        .container { max-width: 1200px; margin: 20px auto; padding: 0 20px; }
        
        /* Secciones */
        .section-header { font-family: 'Bebas Neue', sans-serif; font-size: 1.5rem; letter-spacing: 1px; margin: 30px 0 15px; color: var(--accent); border-bottom: 1px solid var(--border); padding-bottom: 5px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; }

        .platform-card { background: var(--surface); padding: 30px; border-radius: 15px; border-bottom: 5px solid var(--p-color); cursor: pointer; text-align: center; transition: 0.3s; }
        .platform-card:hover { transform: translateY(-5px); filter: brightness(1.2); }
        .platform-card img { max-width: 100px; height: 40px; object-fit: contain; filter: brightness(0) invert(1); }
        
        .item-card { background: var(--surface); border-radius: 12px; overflow: hidden; position: relative; transition: 0.3s; border: 1px solid var(--border); }
        .item-card:hover { transform: scale(1.03); border-color: var(--accent); }
        .poster { width: 100%; aspect-ratio: 2/3; object-fit: cover; }
        .item-info { padding: 12px; }
        .item-title { font-size: 0.85rem; font-weight: bold; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        /* Logos de plataforma en búsqueda */
        .provider-container { display: flex; gap: 5px; margin-top: 8px; flex-wrap: wrap; }
        .provider-logo { width: 20px; height: 20px; border-radius: 4px; object-fit: contain; background: #fff; padding: 2px; }

        .btn-back { background: #333; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; display: none; }
    </style>
</head>
<body>

<header>
    <div class="logo" onclick="location.reload()" style="cursor:pointer">Stream<span>Vault</span></div>
    <div class="search-wrap">
        <input type="text" id="search-input" placeholder="Buscar en todas las plataformas..." onkeyup="handleSearch(event)">
    </div>
    <button class="btn-back" id="btn-back" onclick="location.reload()">← Volver</button>
</header>

<main class="container" id="main-container">
    </main>

<script>
    const API_KEY = '5fe1eec4e7d975c66b9fefa6bd3299ce'; 
    const LANG = 'es-AR';

    const PLATFORMS = [
        { name: 'Netflix', id: 8, color: '#E50914', logo: 'https://upload.wikimedia.org/wikipedia/commons/0/08/Netflix_2015_logo.svg' },
        { name: 'Disney+', id: 337, color: '#006E99', logo: 'https://upload.wikimedia.org/wikipedia/commons/3/3e/Disney%2B_logo.svg' },
        { name: 'Prime Video', id: 119, color: '#00A8E1', logo: 'https://upload.wikimedia.org/wikipedia/commons/1/11/Amazon_Prime_Video_logo.svg' },
        { name: 'Max', id: 384, color: '#8B5CF6', logo: 'https://upload.wikimedia.org/wikipedia/commons/c/ce/Max_logo.svg' }
    ];

    function showPlatforms() {
        const container = document.getElementById('main-container');
        container.innerHTML = `<div class="section-header">Plataformas Disponibles</div><div class="grid" id="platform-grid"></div>`;
        const grid = document.getElementById('platform-grid');
        
        PLATFORMS.forEach(p => {
            const card = document.createElement('div');
            card.className = 'platform-card';
            card.style.setProperty('--p-color', p.color);
            card.onclick = () => loadCatalog(p);
            card.innerHTML = `<img src="${p.logo}" alt="${p.name}">`;
            grid.appendChild(card);
        });
    }

    async function loadCatalog(p) {
        document.getElementById('btn-back').style.display = 'block';
        const container = document.getElementById('main-container');
        container.innerHTML = `<p style="text-align:center">Sincronizando catálogo de ${p.name}...</p>`;

        try {
            const [moviesResp, tvResp] = await Promise.all([
                fetch(`https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&language=${LANG}&sort_by=popularity.desc&with_watch_providers=${p.id}&watch_region=AR`),
                fetch(`https://api.themoviedb.org/3/discover/tv?api_key=${API_KEY}&language=${LANG}&sort_by=popularity.desc&with_watch_providers=${p.id}&watch_region=AR`)
            ]);

            const mData = await moviesResp.json();
            const tData = await tvResp.json();

            container.innerHTML = `
                <div class="section-header">Películas en ${p.name}</div>
                <div class="grid" id="movie-grid"></div>
                <div class="section-header">Series en ${p.name}</div>
                <div class="grid" id="tv-grid"></div>
            `;

            renderGrid(mData.results, 'movie-grid');
            renderGrid(tData.results.map(s => ({...s, title: s.name})), 'tv-grid');

        } catch (e) { container.innerHTML = '<p>Error al conectar.</p>'; }
    }

    async function handleSearch(event) {
        const q = event.target.value.trim();
        if (q.length < 3) { if(q.length === 0) showPlatforms(); return; }
        
        document.getElementById('btn-back').style.display = 'block';
        const container = document.getElementById('main-container');
        container.innerHTML = '<p style="text-align:center">Buscando en todas las plataformas...</p>';

        const resp = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${API_KEY}&language=${LANG}&query=${q}`);
        const data = await resp.json();
        
        container.innerHTML = `<div class="section-header">Resultados de búsqueda</div><div class="grid" id="search-grid"></div>`;
        const grid = document.getElementById('search-grid');

        for (const item of data.results) {
            if (item.media_type === 'person' || !item.poster_path) continue;
            
            // Buscamos dónde se puede ver este item en Argentina
            const provResp = await fetch(`https://api.themoviedb.org/3/${item.media_type}/${item.id}/watch/providers?api_key=${API_KEY}`);
            const provData = await provResp.json();
            const arProviders = provData.results?.AR?.flatrate || [];

            // Cruzamos con nuestros logos conocidos
            const foundLogos = PLATFORMS.filter(p => arProviders.some(ap => ap.provider_id === p.id))
                                       .map(p => `<img src="${p.logo}" class="provider-logo" title="${p.name}">`)
                                       .join('');

            const card = document.createElement('div');
            card.className = 'item-card';
            card.innerHTML = `
                <img class="poster" src="https://image.tmdb.org/t/p/w500${item.poster_path}">
                <div class="item-info">
                    <p class="item-title">${item.title || item.name}</p>
                    <div class="provider-container">${foundLogos || '<span style="font-size:0.7rem;color:#666">Solo alquiler/compra</span>'}</div>
                </div>`;
            grid.appendChild(card);
        }
    }

    function renderGrid(data, gridId) {
        const grid = document.getElementById(gridId);
        data.forEach(m => {
            if(!m.poster_path) return;
            const card = document.createElement('div');
            card.className = 'item-card';
            card.innerHTML = `
                <img class="poster" src="https://image.tmdb.org/t/p/w500${m.poster_path}">
                <div class="item-info">
                    <p class="item-title">${m.title}</p>
                    <p style="font-size:0.7rem; color:var(--muted)">★ ${m.vote_average.toFixed(1)}</p>
                </div>`;
            grid.appendChild(card);
        });
    }

    showPlatforms();
</script>
</body>
</html>
